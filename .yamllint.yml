---
extends: default

yaml-files:
  - "*.yaml"
  - "*.yml"
  - .ansible-lint
  - .yamllint

ignore: |
  .venv/
  .tox/
  collections/
  .ansible/

rules:
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  line-length:
    max: 160
    allow-non-breakable-inline-mappings: true
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    allowed-values: ["true", "false", "on", "off"]
