---
# GL.iNet GL-MT6000 (Flint 2) — MediaTek Filogic 830, 1 GB RAM, 8 GB eMMC
# Reference: docs/Flint_2_AP_Installation_Guide_2026-08-01.md
# Reference: docs/Flint_2_TLS_Certificate_Installation_Guide.md
#
# Manual prerequisites (not managed by Ansible):
# - Factory reset and GL.iNet first-run wizard
# - WAN1 uplink cabled and Access Point mode enabled in GL.iNet UI
# - pfSense DHCP static mapping for management IP (192.168.0.247)
# - GL.iNet firmware upgrade via System → Upgrade
# - LuCI configuration backup before major changes
#
# Live device discovery (2026-08-10, OP25 firmware after factory reset):
# - GL.iNet firmware 4.9.1-op25 on OpenWrt 25.12.5 (apk)
# - AP mode: glconfig.general.mode=ap, LAN proto=dhcp, WAN uplink=eth1
# - Wireless uses mac80211 devices radio0 (2g) / radio1 (5g)
# - Main SSID ifaces: default_radio0 / default_radio1 (guest/iot ifaces exist but are disabled)
# - br-lan MAC 94:83:c4:e3:f4:31 matches pfSense static mapping

openwrt_device_model: glinet,gl-mt6000
openwrt_device_name: Flint 2

flint2_glinet_firmware_version: "4.9.1-op25"
flint2_openwrt_release: "25.12.5"
flint2_network_mode: ap
flint2_lan_proto: dhcp
flint2_wan_device: eth1
flint2_br_lan_mac: "94:83:c4:e3:f4:31"

flint2_fqdn: wapap1003.federation.lcars
flint2_management_ip: 192.168.0.247
flint2_pfsense_gateway: 192.168.0.250
flint2_pfsense_dhcp_hostname: gl-mt6000

flint2_packages_present: []
flint2_packages_absent: []

flint2_hostname: wapap1003
# LuCI System → System → Time Format: 24-Hour Clock
flint2_clock_hourcycle: h23

# GL.iNet UI → System → Upgrade → Automatic Update Check (upgrade.general.upgrade_enable)
flint2_firmware_auto_update_check: "0"

flint2_wireless_device_option_keys:
  - band
  - htmode
  - hwmode
  - legacy_rates
  - require_mode

flint2_wireless_iface_option_keys:
  - ssid
  - encryption
  - key
  - ieee80211k
  - bss_transition

flint2_env_dir: "{{ inventory_dir }}/../.env"
flint2_secrets_dir: "{{ inventory_dir }}/../.secrets"
flint2_wireless_key_file: ARGUS_wifi_password.env

flint2_wireless:
  ssid: ARGUS
  encryption: sae-mixed
  key: "{{ lookup('ansible.builtin.file', flint2_secrets_dir + '/' + flint2_wireless_key_file) | trim }}"
  # 802.11k neighbor/beacon reports + 802.11v BSS Transition Management
  ieee80211k: "1"
  bss_transition: "1"
  radios:
    # GL.iNet Mode 11n/ax — 20/40 MHz (UCI htmode HE40); require_mode n excludes 802.11g-only clients
    - device: radio0
      iface: default_radio0
      band: 2g
      htmode: HE40
      hwmode: 11g
      legacy_rates: "0"
      require_mode: n
    # GL.iNet Mode 11n/ac/ax — 160 MHz; require_mode n allows 802.11n/ac/ax clients
    # (use require_mode ac for 11ac/ax-only, which excludes 802.11n-only clients)
    - device: radio1
      iface: default_radio1
      band: 5g
      htmode: HE160
      hwmode: 11a
      require_mode: n

# Guest/IoT SSIDs (guest2g, guest5g, iot2g, iot5g) are left untouched.
flint2_wireless_guest_ifaces:
  - guest2g
  - guest5g
  - iot2g
  - iot5g

flint2_tls_enabled: true
flint2_tls_cert_files_dir: "{{ flint2_env_dir }}"
flint2_tls_private_key_dir: "{{ flint2_secrets_dir }}"
flint2_tls_leaf_cert: wapap1003.crt
flint2_tls_intermediate_cert: Federation_LCARS_Intermediate_v002.crt
flint2_tls_private_key: wapap1003.key
flint2_tls_fullchain_name: wapap1003-fullchain.crt
flint2_tls_backup_suffix: pre-wapap1003

flint2_tls_nginx_cert_path: /etc/nginx/nginx.cer
flint2_tls_nginx_key_path: /etc/nginx/nginx.key
flint2_tls_uhttpd_cert_path: /etc/uhttpd.crt
flint2_tls_uhttpd_key_path: /etc/uhttpd.key

flint2_tls_verify_endpoints: true
flint2_tls_verify_from_client: true
flint2_tls_verify_host: "{{ flint2_fqdn }}"

# GL.iNet UI → System → Access Control (live values on wapap1003, 2026-08-02)
flint2_access_control_enabled: true
flint2_nginx_gl_conf: /etc/nginx/conf.d/gl.conf
flint2_access_control:
  admin:
    http_port: 80
    https_port: 443
    redirect_https: "1"
    session_timeout_minutes: 180
  luci:
    http_port: 8080
    https_port: 8443
    redirect_https: "1"
  ssh:
    enabled: "1"
    port: 22

# GL.iNet UI → System → Time Zone; upstream NTP via chronyd (firmware 4.8.4+)
flint2_ntp_enabled: true
flint2_ntp:
  servers:
    - pool.ntp.org
  use_dhcp: "0"
  iburst: "1"
  enable_server: "0"

# LuCI → Statistics → Graphs (collectd). Thermal zones on MT7986 appear after
# the first Interval (30s). RRD data is stored in /tmp/rrd and resets on reboot.
flint2_statistics_enabled: true
flint2_statistics_packages:
  - luci-app-statistics
  - collectd
  - collectd-mod-rrdtool
  - collectd-mod-thermal
  - collectd-mod-sensors
flint2_statistics_plugins:
  - collectd_rrdtool
  - collectd_thermal
  - collectd_sensors
flint2_statistics_interval: 30

flint2_ssh_authorized_keys:
  - "{{ lookup('ansible.builtin.file', flint2_env_dir + '/id_ed25519.pub') }}"
  - "{{ lookup('ansible.builtin.file', flint2_env_dir + '/id_ed25519_v002.pub') }}"

# LuCI: System → Administration → Dropbear Instance
flint2_dropbear_password_auth: "off"
flint2_dropbear_root_password_auth: "off"
flint2_ssh_require_authorized_keys: true
