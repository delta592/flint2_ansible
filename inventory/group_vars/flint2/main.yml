---
# GL.iNet GL-MT6000 (Flint 2) — MediaTek Filogic 830, 1 GB RAM, 8 GB eMMC
# Reference: docs/Flint_2_AP_Installation_Guide_2026-08-01.md
# Reference: docs/Flint_2_TLS_Certificate_Installation_Guide.md
#
# Manual prerequisites (not managed by Ansible):
# - Factory reset and GL.iNet first-run wizard
# - WAN1 uplink cabled and Access Point mode enabled in GL.iNet UI
# - pfSense DHCP static mapping for management IP (192.168.0.247)
# - GL.iNet firmware upgrade via System → Upgrade
# - LuCI configuration backup before major changes
#
# Live device discovery (2026-08-10, OP25 firmware after factory reset):
# - GL.iNet firmware 4.9.1-op25 on OpenWrt 25.12.5 (apk)
# - AP mode: glconfig.general.mode=ap, LAN proto=dhcp, WAN uplink=eth1
# - Wireless uses mac80211 devices radio0 (2g) / radio1 (5g)
# - Main SSID ifaces: default_radio0 / default_radio1 (guest/iot ifaces exist but are disabled)
# - br-lan MAC 94:83:c4:e3:f4:31 matches pfSense static mapping

openwrt_device_model: glinet,gl-mt6000
openwrt_device_name: Flint 2

flint2_glinet_firmware_version: "4.9.1-op25"
flint2_openwrt_release: "25.12.5"
flint2_network_mode: ap
flint2_lan_proto: dhcp
flint2_wan_device: eth1
flint2_br_lan_mac: "94:83:c4:e3:f4:31"

# E1/E2: IGMP snooping + multicast querier on the br-lan *device* section
# (not network.lan). Apply with make network from the wired LAN.
flint2_bridge_enabled: true
flint2_bridge_option_keys:
  - igmp_snooping
  - multicast_querier
flint2_bridge:
  name: br-lan
  igmp_snooping: "1"
  multicast_querier: "1"

flint2_fqdn: wapap1003.federation.lcars
flint2_management_ip: 192.168.0.247
flint2_pfsense_gateway: 192.168.0.250
flint2_pfsense_dhcp_hostname: gl-mt6000

flint2_packages_present: []
flint2_packages_absent: []

flint2_hostname: wapap1003
# LuCI System → System → Time Format: 24-Hour Clock
flint2_clock_hourcycle: h23

# GL.iNet UI → System → Upgrade → Automatic Update Check (upgrade.general.upgrade_enable)
flint2_firmware_auto_update_check: "0"

flint2_wireless_device_option_keys:
  - band
  - htmode
  - channel
  - ht_coex
  - hwmode
  - legacy_rates
  - require_mode
  - txpower
  - acs_exclude_dfs
  - cell_density

flint2_wireless_iface_option_keys:
  - ssid
  - encryption
  - key
  - ieee80211k
  - bss_transition
  - wpa_group_rekey
  - wds
  - mbo

flint2_env_dir: "{{ inventory_dir }}/../.env"
flint2_secrets_dir: "{{ inventory_dir }}/../.secrets"
flint2_wireless_key_file: ARGUS_wifi_password.env
flint2_wireless_guest_key_file: guest_passphrases.env

flint2_wireless:
  ssid: ARGUS
  encryption: sae-mixed
  key: "{{ lookup('ansible.builtin.file', flint2_secrets_dir + '/' + flint2_wireless_key_file) | trim }}"
  # 802.11k neighbor/beacon reports + 802.11v BSS Transition Management
  ieee80211k: "1"
  bss_transition: "1"
  # LuCI Network → Wireless → GTK rekeying (seconds)
  wpa_group_rekey: "86400"
  # Disable 4-address WDS (F-04); no client here uses WDS bridging
  wds: "0"
  # Wi-Fi Agile Multiband (MBO): advertise band/BSS preference so capable
  # clients can prefer 5 GHz without waiting for usteer BTM
  mbo: "1"
  radios:
    # F-06: 20 MHz on a non-overlapping channel (1/6/11 only); ht_coex for 802.11n coexistence
    # F-19: lower 2.4 GHz txpower so dual-band clients prefer 5 GHz (LOS IoT at ~15 ft still fine)
    # B2: channel 6 (empty); ch 11 shared CenturyLink4730, ch 1 shared Richard
    # B6: allowlist only the ecobee on 2.4 GHz (band policy, not security)
    # B8: cell_density 2 raises basic_rates to 12/24 Mbit/s
    # B9: require PMF on 2.4 GHz only (ecobee is mfp:true; radio1 stays at 1)
    - device: radio0
      iface: default_radio0
      band: 2g
      htmode: HE20
      channel: "6"
      ht_coex: "1"
      hwmode: 11g
      legacy_rates: "0"
      require_mode: n
      txpower: "15"
      cell_density: "2"
      iface_options:
        macfilter: allow
        maclist:
          - "44:61:32:21:92:66"
        ieee80211w: "2"
    # F-08: 80 MHz on UNII-1 channel 36 (no DFS/CAC); ht_coex for 802.11n coexistence
    # acs_exclude_dfs: inert while channel is pinned; blocks radar channels if ACS returns
    - device: radio1
      iface: default_radio1
      band: 5g
      htmode: HE80
      channel: "36"
      ht_coex: "1"
      hwmode: 11a
      require_mode: n
      acs_exclude_dfs: "1"

# Guest/IoT SSIDs stay disabled; rotate factory goodlife/psk2 to sae-mixed + strong key (F-03).
flint2_wireless_guest_ifaces:
  - guest2g
  - guest5g
  - iot2g
  - iot5g
flint2_wireless_guest_option_keys:
  - encryption
  - key
flint2_wireless_guest:
  encryption: sae-mixed
  key: "{{ lookup('ansible.builtin.file', flint2_secrets_dir + '/' + flint2_wireless_guest_key_file) | trim }}"

flint2_tls_enabled: true
flint2_tls_cert_files_dir: "{{ flint2_env_dir }}"
flint2_tls_private_key_dir: "{{ flint2_secrets_dir }}"
flint2_tls_leaf_cert: wapap1003.crt
flint2_tls_intermediate_cert: Federation_LCARS_Intermediate_v002.crt
flint2_tls_private_key: wapap1003.key
flint2_tls_fullchain_name: wapap1003-fullchain.crt
flint2_tls_backup_suffix: pre-wapap1003

flint2_tls_nginx_cert_path: /etc/nginx/nginx.cer
flint2_tls_nginx_key_path: /etc/nginx/nginx.key
flint2_tls_uhttpd_cert_path: /etc/uhttpd.crt
flint2_tls_uhttpd_key_path: /etc/uhttpd.key

flint2_tls_verify_endpoints: true
flint2_tls_verify_from_client: true
flint2_tls_verify_host: "{{ flint2_fqdn }}"

# F-07 / F-09: HSTS + security headers in gl-conf.d (accept vendor nginx user root)
flint2_nginx_hardening_enabled: true
flint2_nginx_gl_conf_d: /etc/nginx/gl-conf.d
flint2_nginx_security_conf_name: flint2-security-headers.conf
flint2_nginx_security_lua_path: /usr/share/gl-ngx/flint2-security-headers.lua
flint2_nginx_server_tokens: "off"
flint2_nginx_hsts_max_age: 63072000
flint2_nginx_verify_headers: true
# F-28: drop obsolete CBC suites from vendor ssl_ciphers (rewrite gl.conf line)
flint2_nginx_manage_ssl_ciphers: true
flint2_nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# GL.iNet UI → System → Access Control (live values on wapap1003, 2026-08-02)
flint2_access_control_enabled: true
flint2_nginx_gl_conf: /etc/nginx/conf.d/gl.conf
flint2_access_control:
  admin:
    http_port: 80
    https_port: 443
    redirect_https: "1"
    session_timeout_minutes: 180
  luci:
    http_port: 8080
    https_port: 8443
    redirect_https: "1"
  ssh:
    enabled: "1"
    port: 22

# GL.iNet UI → System → Time Zone; upstream NTP via chronyd (firmware 4.8.4+)
flint2_ntp_enabled: true
flint2_ntp:
  servers:
    - pool.ntp.org
  use_dhcp: "0"
  iburst: "1"
  enable_server: "0"

# LuCI → Statistics → Graphs (collectd). Thermal zones on MT7986 appear after
# the first Interval (30s). RRD data is stored in /tmp/rrd and resets on reboot.
flint2_statistics_enabled: true
flint2_statistics_packages:
  - luci-app-statistics
  - collectd
  - collectd-mod-rrdtool
  - collectd-mod-thermal
  - collectd-mod-sensors
flint2_statistics_plugins:
  - collectd_rrdtool
  - collectd_thermal
  - collectd_sensors
flint2_statistics_interval: 30

# Active AP-side band steering via usteer (needs ieee80211k + bss_transition above).
# Installs usteer + luci-app-usteer from the device package feeds (apk on OP25).
flint2_usteer_enabled: true
flint2_usteer_packages:
  - usteer
  - luci-app-usteer
flint2_usteer:
  network: lan
  local_mode: "1"
  syslog: "1"
  debug_level: "2"
  ipv6: "0"
  # D1: refuse 2.4 GHz assoc when the client has been seen probing 5 GHz
  assoc_steering: "1"
  # D3: worst-case 2.4 GHz dwell before reactive steer (was 30000)
  band_steering_interval: "10000"
  # D2: SNR gate in dB (was -60, which never gated); measured SNRs are 40–52 dB
  band_steering_min_snr: "15"
  band_steering_threshold: "1"
  # Empty → use flint2_wireless.ssid (ARGUS)
  ssid_list: []

# SSH: OpenSSH replaces Dropbear so Kex/Cipher/MAC lists are enforceable.
# Algorithms: ssh-audit OpenSSH 10.x hardening (PQ KEX + ETM MACs).
flint2_ssh_backend: openssh
flint2_sshd_listen_address: "{{ flint2_management_ip }}"
flint2_sshd_kex_algorithms: mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com
flint2_sshd_host_key_algorithms: ssh-ed25519
flint2_sshd_pubkey_accepted_algorithms: ssh-ed25519,sk-ssh-ed25519@openssh.com
flint2_sshd_ciphers: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-gcm@openssh.com,aes128-ctr
flint2_sshd_macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
flint2_sshd_per_source_max_startups: ""
flint2_ssh_authorized_keys:
  - "{{ lookup('ansible.builtin.file', flint2_env_dir + '/id_ed25519.pub') }}"
  - "{{ lookup('ansible.builtin.file', flint2_env_dir + '/id_ed25519_v002.pub') }}"

# Kept for Dropbear UCI if backend is switched back; also disabled under OpenSSH.
flint2_dropbear_password_auth: "off"
flint2_dropbear_root_password_auth: "off"
flint2_ssh_require_authorized_keys: true
flint2_dropbear_keyfiles:
  - /etc/dropbear/dropbear_ed25519_host_key
flint2_dropbear_max_auth_tries: "3"
flint2_dropbear_idle_timeout: "300"
flint2_dropbear_mdns: "0"
flint2_dropbear_interface: lan
