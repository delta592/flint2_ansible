[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flint2-ansible-hooks"
version = "1.0.0"
description = "Skip spurious ansible-config notices for unused deprecated callbacks"
requires-python = ">=3.14,<3.15"
readme = "README.md"

[tool.hatch.build.targets.wheel.force-include]
"src/flint2_ansible_hooks.py" = "flint2_ansible_hooks.py"
"src/flint2_ansible_hooks.pth" = "flint2_ansible_hooks.pth"
