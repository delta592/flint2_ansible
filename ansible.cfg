[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ./collections
gather_facts = false
retry_files_enabled = false
interpreter_python = auto_silent
# Use community.openwrt.setup for hosts with openwrt_gather_facts: true
action_plugins = ./collections/ansible_collections/community/openwrt/plugins/plugin_utils/_setup

[privilege_escalation]
become = false

[ssh_connection]
# Reuse one SSH connection per host. Every community.openwrt task makes several
# round trips (temp dir, script uploads, chmod, run, cleanup), so without a mux
# each one pays a full key exchange. `make known-hosts-reset` exits this socket.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/%%r@%%h-%%p
pipelining = true
scp_if_ssh = true
scp_extra_args = -O
