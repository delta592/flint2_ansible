[project]
name = "flint2-ansible"
version = "1.0.0"
description = "Development tooling for GL.iNet Flint 2 Ansible automation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ansible-core==2.22.0",
]

[dependency-groups]
dev = [
    "ansible-builder==3.2.0",
    "ansible-lint==26.11.0",
    "ansible-navigator==26.11.0",
    "docker==7.2.0",
    "molecule==26.11.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "requests==2.34.2",
    "tox==4.67.16",
    "tox-ansible==26.11.0",
    "flint2-ansible-hooks",
    "yamllint==1.38.0",
]

[tool.uv.sources]
flint2-ansible-hooks = { path = "tools/ansible-hooks", editable = false }


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["scripts/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.tox]
requires = ["tox>=4.2", "tox-ansible"]
env_list = [
    "lint",
    "syntax",
    "molecule",
    "pytest",
    "secrets",
]

[tool.tox.env_run_base]
description = "Shared settings for flint2_ansible validation environments"
skip_install = true
allowlist_externals = ["uv", "gitleaks"]
pass_env = [
    "DOCKER_HOST",
    "HOME",
    "PATH",
    "SSH_AUTH_SOCK",
    "USER",
    "UV_*",
]
set_env.TOX_WORK_DIR = "{toxworkdir}"

[tool.tox.env.lint]
description = "Run ansible-lint and yamllint"
commands = [
    ["uv", "run", "ansible-galaxy", "collection", "install", "-r", "requirements.yml", "-p", ".ansible/collections"],
    ["uv", "run", "ansible-lint"],
    ["uv", "run", "yamllint", "."],
]

[tool.tox.env.syntax]
description = "Validate Ansible playbook syntax"
commands = [
    ["uv", "run", "ansible-playbook", "--syntax-check", "playbooks/site.yml"],
    ["uv", "run", "ansible-playbook", "--syntax-check", "playbooks/ping.yml"],
    ["uv", "run", "ansible-playbook", "--syntax-check", "playbooks/enable_dropbear_rpc.yml"],
    ["uv", "run", "ansible-playbook", "--syntax-check", "playbooks/post_upgrade.yml"],
]

[tool.tox.env.molecule]
description = "Run Molecule integration tests for the flint2 role"
commands = [
    ["uv", "run", "molecule", "test", "-s", "default"],
]
change_dir = "roles/flint2"

[tool.tox.env.pytest]
description = "Run pytest project, script unit tests, and coverage"
commands = [
    ["uv", "run", "pytest"],
]

[tool.tox.env.secrets]
description = "Scan the repository for accidentally committed secrets"
commands = [
    ["gitleaks", "detect", "--source", ".", "--config", ".gitleaks.toml", "--no-banner"],
]

[tool.tox-ansible]
coverage = true
molecule = "auto"
skip = [
    "devel",
    "sanity",
    "unit",
]
