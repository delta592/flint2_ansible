---
- name: Destroy
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read OpenWrt test platform settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/openwrt-versions.yml"
        name: _openwrt

    - name: Remove OpenWrt test container
      community.docker.docker_container:
        name: "{{ _openwrt.container_name }}"
        state: absent
        force_kill: true

    - name: Remove OpenWrt 25.12.5 rootfs test images
      when: lookup('env', 'MOLECULE_OPENWRT_PRUNE_IMAGE') | default('false', true) | bool
      community.docker.docker_image:
        name: "{{ _openwrt.rootfs.local_image }}-{{ item }}"
        state: absent
      loop: "{{ _openwrt.rootfs.arches | list }}"
