---
flint2_hostname: router
# LuCI System → System → Time Format (clock_hourcycle UCI option)
flint2_clock_hourcycle: h23

# GL.iNet UI → System → Upgrade → Automatic Update Check (upgrade.general.upgrade_enable)
flint2_firmware_auto_update_check: "0"

flint2_network_mode: router
flint2_lan_proto: static
flint2_wan_device: eth1

# Extra packages to install or remove with the detected package manager (apk or opkg).
flint2_packages_present: []
flint2_packages_absent: []

# E1/E2: IGMP snooping + multicast querier on the LAN bridge device section
# (not network.lan). Apply with make network from the wired LAN.
flint2_bridge_enabled: true
flint2_bridge_option_keys:
  - igmp_snooping
  - multicast_querier
flint2_bridge:
  name: br-lan
  igmp_snooping: "1"
  multicast_querier: "1"

flint2_wireless_device_option_keys:
  - band
  - htmode
  - channel
  - ht_coex
  - hwmode
  - legacy_rates
  - require_mode
  - txpower
  - acs_exclude_dfs
  - cell_density
  - random_bssid

flint2_wireless_iface_option_keys:
  - ssid
  - encryption
  - key
  - ieee80211k
  - bss_transition
  - wpa_group_rekey
  - wds
  - mbo
  - random_bssid

flint2_wireless:
  ssid: ARGUS
  encryption: sae-mixed
  key: ""
  # 802.11k RRM + 802.11v BSS Transition Management (client-assisted steering)
  ieee80211k: "1"
  bss_transition: "1"
  # LuCI GTK rekeying (seconds); hostapd wpa_group_rekey
  wpa_group_rekey: "86400"
  # Disable 4-address WDS so authenticated stations cannot bridge into br-lan
  wds: "0"
  # Wi-Fi Agile Multiband (MBO) band/BSS preference advertisement
  mbo: "1"
  # GL.iNet UI → Wireless → Enable Randomized BSSID (wifi-iface; also set on wifi-device)
  random_bssid: "0"
  radios: []

flint2_wireless_guest_ifaces: []
flint2_wireless_guest_option_keys:
  - encryption
  - key
flint2_wireless_guest:
  encryption: sae-mixed
  key: ""

flint2_env_dir: "{{ inventory_dir }}/../.env"
flint2_secrets_dir: "{{ inventory_dir }}/../.secrets"
flint2_wireless_key_file: ARGUS_wifi_password.env
flint2_wireless_guest_key_file: guest_passphrases.env

flint2_tls_enabled: false
flint2_tls_cert_files_dir: "{{ flint2_env_dir }}"
flint2_tls_private_key_dir: "{{ flint2_secrets_dir }}"
flint2_tls_leaf_cert: server.crt
flint2_tls_intermediate_cert: intermediate.crt
flint2_tls_private_key: server.key
flint2_tls_fullchain_name: fullchain.crt
flint2_tls_backup_suffix: pre-ansible

flint2_tls_nginx_cert_path: /etc/nginx/nginx.cer
flint2_tls_nginx_key_path: /etc/nginx/nginx.key
flint2_tls_uhttpd_cert_path: /etc/uhttpd.crt
flint2_tls_uhttpd_key_path: /etc/uhttpd.key

flint2_tls_verify_endpoints: false
flint2_tls_verify_from_client: true
flint2_tls_verify_host: "{{ flint2_fqdn | default(ansible_host) }}"

flint2_ssh_authorized_keys: []

# openssh: required to set KexAlgorithms/Ciphers/MACs (Dropbear is compile-time only).
# dropbear: Molecule / fallback; cannot clear NIST ECDH ssh-audit FAILs.
flint2_ssh_backend: openssh
flint2_openssh_packages:
  - openssh-server
  - openssh-keygen
  - openssh-sftp-server
  - dropbearconvert
flint2_sshd_config_d: /etc/ssh/sshd_config.d
flint2_sshd_hardening_conf_name: 99-flint2-hardening.conf
# ssh-audit OpenSSH 10.x suite (PQ KEX; ETM MACs; prefer GCM/ChaCha).
flint2_sshd_kex_algorithms: mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com
flint2_sshd_host_key_algorithms: ssh-ed25519
flint2_sshd_pubkey_accepted_algorithms: ssh-ed25519,sk-ssh-ed25519@openssh.com
flint2_sshd_ciphers: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-gcm@openssh.com,aes128-ctr
flint2_sshd_macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
flint2_sshd_password_authentication: "no"
flint2_sshd_permit_root_login: prohibit-password
flint2_sshd_max_auth_tries: 3
flint2_sshd_login_grace_time: 30
flint2_sshd_client_alive_interval: 300
flint2_sshd_client_alive_count_max: 2
# Empty: omit PerSourceMaxStartups (value 1 false-positives ssh-audit DHEat and can lock out Ansible).
flint2_sshd_per_source_max_startups: ""
flint2_sshd_max_startups: "10:30:60"
# Optional ListenAddress (inventory sets management IP).
# flint2_sshd_listen_address: 192.168.0.247
# Reconnect wait after sshd reload/cutover (ssh_openssh.yml) and after Wi-Fi / Dropbear handler restarts.
flint2_ssh_wait_delay: 8
flint2_ssh_wait_timeout: 180
flint2_ssh_wait_sleep: 3
flint2_ssh_wait_connect_timeout: 5

flint2_dropbear_password_auth: "off"
flint2_dropbear_root_password_auth: "off"
flint2_ssh_require_authorized_keys: true
# Dropbear-only settings (used when flint2_ssh_backend=dropbear).
flint2_dropbear_keyfiles:
  - /etc/dropbear/dropbear_ed25519_host_key
flint2_dropbear_max_auth_tries: "3"
flint2_dropbear_idle_timeout: "300"
flint2_dropbear_mdns: "0"
# Optional: bind Dropbear to a UCI network (e.g. lan). Leave unset to listen on all.
# flint2_dropbear_interface: lan

# GL.iNet OP25 ships LuCI as optional bundled APKs; uHTTPd alone returns 404 for /cgi-bin/luci/.
flint2_luci_enabled: true

# GL.iNet UI → System → Access Control; flint2_access_control below matches the
# live values on wapap1003 (2026-08-02).
flint2_access_control_enabled: true
flint2_nginx_gl_conf: /etc/nginx/conf.d/gl.conf

# F-07 / F-09: security headers + server_tokens via /etc/nginx/gl-conf.d/
# (vendor keeps `user root;` — accepted risk for the Lua/ubus admin API).
flint2_nginx_hardening_enabled: true
flint2_nginx_gl_conf_d: /etc/nginx/gl-conf.d
flint2_nginx_security_conf_name: flint2-security-headers.conf
flint2_nginx_security_lua_path: /usr/share/gl-ngx/flint2-security-headers.lua
flint2_nginx_server_tokens: "off"
flint2_nginx_hsts_max_age: 63072000
flint2_nginx_verify_headers: true
# F-28 / scanner: AEAD-only TLS 1.2 suites (TLS 1.3 is separate and already AEAD-only).
# ssl_ciphers cannot be set from gl-conf.d (duplicate directive); rewrite the line in gl.conf.
flint2_nginx_manage_ssl_ciphers: true
flint2_nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
flint2_access_control:
  admin:
    http_port: 80
    https_port: 443
    redirect_https: "1"
    session_timeout_minutes: 180
  luci:
    http_port: 8080
    https_port: 8443
    redirect_https: "1"
  ssh:
    enabled: "1"
    port: 22

# GL.iNet UI → System → Time Zone; upstream NTP via chronyd (firmware 4.8.4+)
flint2_ntp_enabled: true
flint2_ntp:
  servers:
    - pool.ntp.org
  use_dhcp: "0"
  iburst: "1"
  enable_server: "0"

# LuCI Statistics (collectd) — thermal graphs at Statistics → Graphs. Thermal zones
# on MT7986 appear after the first Interval (30s). RRD data is stored in /tmp/rrd
# and resets on reboot.
flint2_statistics_enabled: true
flint2_statistics_packages:
  - luci-app-statistics
  - collectd
  - collectd-mod-rrdtool
  - collectd-mod-thermal
  - collectd-mod-sensors
flint2_statistics_plugins:
  - collectd_rrdtool
  - collectd_thermal
  - collectd_sensors
flint2_statistics_interval: 30

# Active AP-side steering (usteer) — requires ieee80211k + bss_transition on wifi-ifaces.
# Installs usteer + luci-app-usteer from the device package feeds (apk on OP25).
flint2_usteer_enabled: true
flint2_usteer_packages:
  - usteer
  - luci-app-usteer
flint2_usteer:
  network: lan
  # Single-AP band steering; set "0" when coordinating multiple APs over the LAN
  local_mode: "1"
  syslog: "1"
  debug_level: "2"
  ipv6: "0"
  # Refuse lower-band association when the client has been seen on a higher band
  # (D1: refuse 2.4 GHz assoc when the client has been seen probing 5 GHz)
  assoc_steering: "1"
  # Steer clients to a higher band every N ms (0 disables band steering)
  # (D3: worst-case 2.4 GHz dwell before reactive steer; was 30000)
  band_steering_interval: "10000"
  # D2: SNR gate in dB (was -60, which never gated); measured SNRs are 40–52 dB
  band_steering_min_snr: "15"
  band_steering_threshold: "1"
  # SSIDs to steer; defaults to flint2_wireless.ssid when empty
  ssid_list: []

# Set false when verifying against vanilla OpenWrt (for example Molecule containers).
flint2_verify_glinet_settings: true
# Live runtime checks need a real router (Docker test containers cannot set kernel hostname or broadcast Wi-Fi).
flint2_verify_live_hostname: true
flint2_verify_live_wireless: true
flint2_verify_live_bridge: true
