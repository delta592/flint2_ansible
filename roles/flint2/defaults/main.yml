---
flint2_hostname: router
# LuCI System → System → Time Format (clock_hourcycle UCI option)
flint2_clock_hourcycle: h23

# GL.iNet UI → System → Upgrade → Automatic Update Check (upgrade.general.upgrade_enable)
flint2_firmware_auto_update_check: "0"

flint2_network_mode: router
flint2_lan_proto: static
flint2_wan_device: eth1

flint2_wireless_device_option_keys:
  - band
  - htmode
  - channel
  - ht_coex
  - hwmode
  - legacy_rates
  - require_mode
  - txpower

flint2_wireless_iface_option_keys:
  - ssid
  - encryption
  - key
  - ieee80211k
  - bss_transition
  - wpa_group_rekey
  - wds

flint2_wireless:
  ssid: ARGUS
  encryption: sae-mixed
  key: ""
  # 802.11k RRM + 802.11v BSS Transition Management (client-assisted steering)
  ieee80211k: "1"
  bss_transition: "1"
  # LuCI GTK rekeying (seconds); hostapd wpa_group_rekey
  wpa_group_rekey: "86400"
  # Disable 4-address WDS so authenticated stations cannot bridge into br-lan
  wds: "0"
  radios: []

flint2_wireless_guest_ifaces: []
flint2_wireless_guest_option_keys:
  - encryption
  - key
flint2_wireless_guest:
  encryption: sae-mixed
  key: ""

flint2_env_dir: "{{ inventory_dir }}/../.env"
flint2_secrets_dir: "{{ inventory_dir }}/../.secrets"
flint2_wireless_key_file: ARGUS_wifi_password.env
flint2_wireless_guest_key_file: guest_passphrases.env

flint2_tls_enabled: false
flint2_tls_cert_files_dir: "{{ flint2_env_dir }}"
flint2_tls_private_key_dir: "{{ flint2_secrets_dir }}"
flint2_tls_leaf_cert: server.crt
flint2_tls_intermediate_cert: intermediate.crt
flint2_tls_private_key: server.key
flint2_tls_fullchain_name: fullchain.crt
flint2_tls_backup_suffix: pre-ansible

flint2_tls_nginx_cert_path: /etc/nginx/nginx.cer
flint2_tls_nginx_key_path: /etc/nginx/nginx.key
flint2_tls_uhttpd_cert_path: /etc/uhttpd.crt
flint2_tls_uhttpd_key_path: /etc/uhttpd.key

flint2_tls_verify_endpoints: false
flint2_tls_verify_from_client: true
flint2_tls_verify_host: "{{ flint2_fqdn | default(ansible_host) }}"

flint2_ssh_authorized_keys: []

flint2_dropbear_password_auth: "off"
flint2_dropbear_root_password_auth: "off"
flint2_ssh_require_authorized_keys: true

# GL.iNet OP25 ships LuCI as optional bundled APKs; uHTTPd alone returns 404 for /cgi-bin/luci/.
flint2_luci_enabled: true

flint2_access_control_enabled: true
flint2_nginx_gl_conf: /etc/nginx/conf.d/gl.conf

# F-07 / F-09: security headers + server_tokens via /etc/nginx/gl-conf.d/
# (vendor keeps `user root;` — accepted risk for the Lua/ubus admin API).
flint2_nginx_hardening_enabled: true
flint2_nginx_gl_conf_d: /etc/nginx/gl-conf.d
flint2_nginx_security_conf_name: flint2-security-headers.conf
flint2_nginx_security_lua_path: /usr/share/gl-ngx/flint2-security-headers.lua
flint2_nginx_server_tokens: "off"
flint2_nginx_hsts_max_age: 63072000
flint2_nginx_verify_headers: true
# F-28 / scanner: AEAD-only TLS 1.2 suites (TLS 1.3 is separate and already AEAD-only).
# ssl_ciphers cannot be set from gl-conf.d (duplicate directive); rewrite the line in gl.conf.
flint2_nginx_manage_ssl_ciphers: true
flint2_nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
flint2_access_control:
  admin:
    http_port: 80
    https_port: 443
    redirect_https: "1"
    session_timeout_minutes: 180
  luci:
    http_port: 8080
    https_port: 8443
    redirect_https: "1"
  ssh:
    enabled: "1"
    port: 22

flint2_ntp_enabled: true
flint2_ntp:
  servers:
    - pool.ntp.org
  use_dhcp: "0"
  iburst: "1"
  enable_server: "0"

# LuCI Statistics (collectd) — thermal graphs at Statistics → Graphs
flint2_statistics_enabled: true
flint2_statistics_packages:
  - luci-app-statistics
  - collectd
  - collectd-mod-rrdtool
  - collectd-mod-thermal
  - collectd-mod-sensors
flint2_statistics_plugins:
  - collectd_rrdtool
  - collectd_thermal
  - collectd_sensors
flint2_statistics_interval: 30

# Active AP-side steering (usteer) — requires ieee80211k + bss_transition on wifi-ifaces
flint2_usteer_enabled: true
flint2_usteer_packages:
  - usteer
  - luci-app-usteer
flint2_usteer:
  network: lan
  # Single-AP band steering; set "0" when coordinating multiple APs over the LAN
  local_mode: "1"
  syslog: "1"
  debug_level: "2"
  ipv6: "0"
  # Steer clients to a higher band every N ms (0 disables band steering)
  band_steering_interval: "30000"
  band_steering_min_snr: "-60"
  band_steering_threshold: "1"
  # SSIDs to steer; defaults to flint2_wireless.ssid when empty
  ssid_list: []

# Set false when verifying against vanilla OpenWrt (for example Molecule containers).
flint2_verify_glinet_settings: true
# Live runtime checks need a real router (Docker test containers cannot set kernel hostname or broadcast Wi-Fi).
flint2_verify_live_hostname: true
flint2_verify_live_wireless: true
