---
argument_specs:
  main:
    short_description: Configure a GL.iNet GL-MT6000 (Flint 2) running OpenWrt
    description:
      - Apply system, wireless, TLS, SSH, statistics, and verification settings to a Flint 2 device.
      - GL.iNet-specific UCI keys are used where required; TLS and wireless checks can be disabled for test environments.
    author: delta592
    options:
      flint2_hostname:
        type: str
        description: System hostname written to UCI system.@system[0].hostname.
      flint2_clock_hourcycle:
        type: str
        default: h23
        description: >-
          LuCI System → System → Time Format (system.@system[0].clock_hourcycle).
          Use h23 for 24-Hour Clock, h12 for 12-Hour Clock, or an empty string for Default.
      flint2_firmware_auto_update_check:
        type: str
        default: "0"
        choices:
          - "0"
          - "1"
        description: >-
          GL.iNet UI → System → Upgrade → Automatic Update Check
          (upgrade.general.upgrade_enable). Use "0" to disable background firmware update checks.
      flint2_network_mode:
        type: str
        description: Expected GL.iNet network mode in glconfig.general.mode (for example ap or router).
      flint2_lan_proto:
        type: str
        description: Expected LAN protocol in network.lan.proto (for example dhcp or static).
      flint2_wan_device:
        type: str
        description: Expected WAN uplink device name.
      flint2_fqdn:
        type: str
        description: Fully qualified domain name used for TLS verification and SNI checks.
      flint2_management_ip:
        type: str
        description: Expected management IP address for documentation and validation.
      flint2_packages_present:
        type: list
        elements: str
        default: []
        description: Packages to install with opkg or apk.
      flint2_packages_absent:
        type: list
        elements: str
        default: []
        description: Packages to remove with opkg or apk.
      flint2_wireless_device_option_keys:
        type: list
        elements: str
        default:
          - band
          - htmode
          - hwmode
          - legacy_rates
          - require_mode
        description: Radio device option keys copied from each flint2_wireless.radios entry.
      flint2_wireless_iface_option_keys:
        type: list
        elements: str
        default:
          - ssid
          - encryption
          - key
          - ieee80211k
          - bss_transition
          - wpa_group_rekey
          - wds
        description: >-
          Shared wifi-iface option keys copied from flint2_wireless onto each
          main AP interface (ssid, encryption, key, ieee80211k, bss_transition,
          wpa_group_rekey, wds).
      flint2_wireless:
        type: dict
        description: Wireless SSID, encryption, key, roaming aids, and per-radio device settings.
        options:
          ssid:
            type: str
            description: Main wireless SSID applied to configured AP interfaces.
          encryption:
            type: str
            description: Wireless encryption mode (for example sae-mixed or none).
          key:
            type: str
            default: ""
            description: Wireless passphrase applied when non-empty.
          ieee80211k:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Enable 802.11k Radio Resource Measurement (neighbor and beacon
              reports) on main AP interfaces.
          bss_transition:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Enable 802.11v BSS Transition Management on main AP interfaces
              so clients can be steered between BSS/radios.
          wpa_group_rekey:
            type: str
            default: "86400"
            description: >-
              GTK rekeying interval in seconds (LuCI Network → Wireless →
              GTK rekeying; UCI wireless.<iface>.wpa_group_rekey).
          wds:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: >-
              4-address WDS mode on main AP interfaces. Keep "0" unless a
              WDS client or wireless bridge is intentionally used.
          radios:
            type: list
            elements: dict
            default: []
            description: Radio and interface definitions for wireless UCI device sections.
            options:
              device:
                type: str
                required: true
                description: UCI wireless device section name.
              iface:
                type: str
                required: true
                description: UCI wireless interface section name.
              band:
                type: str
                description: Radio band (2g or 5g).
              htmode:
                type: str
                description: >-
                  Channel width / Wi-Fi generation mode (for example HE40 for 2.4 GHz
                  20/40 MHz, HE160 for 5 GHz 160 MHz).
              hwmode:
                type: str
                description: Legacy hardware mode when applicable.
              legacy_rates:
                type: str
                description: Whether legacy rates are enabled.
              require_mode:
                type: str
                description: >-
                  Minimum client PHY mode (UCI wireless device option). On 2.4 GHz,
                  n maps to GL.iNet 11n/ax; on 5 GHz, n maps to 11n/ac/ax (use ac for
                  11ac/ax-only).
      flint2_wireless_guest_ifaces:
        type: list
        elements: str
        default: []
        description: Guest or IoT interface names expected to remain disabled.
      flint2_env_dir:
        type: path
        description: Control-node directory containing public certificates and SSH public keys.
      flint2_secrets_dir:
        type: path
        description: Control-node directory containing private keys and other secrets.
      flint2_wireless_key_file:
        type: str
        default: ARGUS_wifi_password.env
        description: >-
          Filename in flint2_secrets_dir containing the main Wi-Fi passphrase
          (single line, no KEY=value syntax).
      flint2_tls_enabled:
        type: bool
        default: false
        description: Deploy TLS certificates to nginx and uHTTPd when true.
      flint2_tls_cert_files_dir:
        type: path
        description: Directory containing leaf and intermediate certificate files.
      flint2_tls_private_key_dir:
        type: path
        description: Directory containing the TLS private key file.
      flint2_tls_leaf_cert:
        type: str
        default: server.crt
        description: Leaf certificate filename in flint2_tls_cert_files_dir.
      flint2_tls_intermediate_cert:
        type: str
        default: intermediate.crt
        description: Intermediate certificate filename in flint2_tls_cert_files_dir.
      flint2_tls_private_key:
        type: str
        default: server.key
        description: Private key filename in flint2_tls_private_key_dir.
      flint2_tls_fullchain_name:
        type: str
        default: fullchain.crt
        description: Generated full-chain filename on the control node.
      flint2_tls_backup_suffix:
        type: str
        default: pre-ansible
        description: Suffix appended to remote certificate backups.
      flint2_tls_nginx_cert_path:
        type: path
        default: /etc/nginx/nginx.cer
        description: Remote nginx certificate path on the router.
      flint2_tls_nginx_key_path:
        type: path
        default: /etc/nginx/nginx.key
        description: Remote nginx private key path on the router.
      flint2_tls_uhttpd_cert_path:
        type: path
        default: /etc/uhttpd.crt
        description: Remote uHTTPd certificate path on the router.
      flint2_tls_uhttpd_key_path:
        type: path
        default: /etc/uhttpd.key
        description: Remote uHTTPd private key path on the router.
      flint2_tls_verify_endpoints:
        type: bool
        default: false
        description: Validate served TLS fingerprints during the verify tag.
      flint2_tls_verify_from_client:
        type: bool
        default: true
        description: Compare remote TLS endpoints against the local leaf certificate.
      flint2_tls_verify_host:
        type: str
        description: Hostname or address used for client-side TLS verification.
      flint2_ssh_authorized_keys:
        type: list
        elements: str
        default: []
        description: SSH public keys installed into /etc/dropbear/authorized_keys.
      flint2_dropbear_password_auth:
        type: str
        default: "off"
        choices:
          - "on"
          - "off"
        description: Value for dropbear.main.PasswordAuth.
      flint2_dropbear_root_password_auth:
        type: str
        default: "off"
        choices:
          - "on"
          - "off"
        description: Value for dropbear.main.RootPasswordAuth.
      flint2_ssh_require_authorized_keys:
        type: bool
        default: true
        description: Fail verification when authorized_keys is missing or empty.
      flint2_verify_glinet_settings:
        type: bool
        default: true
        description: Validate GL.iNet-specific UCI settings such as glconfig.general.mode.
      flint2_access_control_enabled:
        type: bool
        default: true
        description: Apply and verify GL.iNet Access Control settings when true.
      flint2_luci_enabled:
        type: bool
        default: true
        description: >-
          Install bundled GL.iNet LuCI packages and uhttpd-mod-ucode when true.
          OP25 ships LuCI as optional APKs; without this, uHTTPd returns 404 for /cgi-bin/luci/.
      flint2_nginx_gl_conf:
        type: path
        default: /etc/nginx/conf.d/gl.conf
        description: nginx configuration file containing GL.iNet admin panel listen directives.
      flint2_access_control:
        type: dict
        description: GL.iNet Access Control page settings for admin panel, LuCI, and SSH.
        options:
          admin:
            type: dict
            description: GL.iNet admin panel ports, Force HTTPS, and auto-logout settings.
            options:
              http_port:
                type: int
                description: Admin panel HTTP port written to nginx gl.conf.
              https_port:
                type: int
                description: Admin panel HTTPS port written to nginx gl.conf.
              redirect_https:
                type: str
                choices:
                  - "0"
                  - "1"
                description: oui-httpd.main.redirect_https Force HTTPS setting.
              session_timeout_minutes:
                type: int
                description: Admin auto-logout interval in minutes (stored as seconds in oui-httpd.main.session_timeout).
          luci:
            type: dict
            description: LuCI uHTTPd listener and Force HTTPS settings.
            options:
              http_port:
                type: int
                description: LuCI HTTP port (uhttpd.main.listen_http).
              https_port:
                type: int
                description: LuCI HTTPS port (uhttpd.main.listen_https).
              redirect_https:
                type: str
                choices:
                  - "0"
                  - "1"
                description: uhttpd.main.redirect_https Force HTTPS setting.
          ssh:
            type: dict
            description: Dropbear SSH enablement and port settings.
            options:
              enabled:
                type: str
                choices:
                  - "0"
                  - "1"
                description: dropbear.main.enable SSH service toggle.
              port:
                type: int
                description: dropbear.main.Port SSH listen port.
      flint2_ntp_enabled:
        type: bool
        default: true
        description: Apply and verify NTP time synchronization settings when true.
      flint2_ntp:
        type: dict
        description: Upstream NTP server settings for chronyd (GL.iNet 4.8.4+) or sysntpd.
        options:
          servers:
            type: list
            elements: str
            default:
              - pool.ntp.org
            description: Upstream NTP pool or server hostnames.
          use_dhcp:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: system.ntp.use_dhcp for sysntpd; ignored on chronyd.
          iburst:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: chrony.flint2.iburst setting for faster initial sync.
          enable_server:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: system.ntp.enable_server for sysntpd LAN time serving.
      flint2_statistics_enabled:
        type: bool
        default: true
        description: >-
          Install luci-app-statistics/collectd and enable thermal and sensors
          plugins when true. Graphs appear in LuCI under Statistics → Graphs.
      flint2_statistics_packages:
        type: list
        elements: str
        default:
          - luci-app-statistics
          - collectd
          - collectd-mod-rrdtool
          - collectd-mod-thermal
          - collectd-mod-sensors
        description: Packages installed for LuCI Statistics and thermal collection.
      flint2_statistics_plugins:
        type: list
        elements: str
        default:
          - collectd_rrdtool
          - collectd_thermal
          - collectd_sensors
        description: luci_statistics UCI sections whose enable option is set to 1.
      flint2_statistics_interval:
        type: int
        default: 30
        description: collectd read interval in seconds (luci_statistics.collectd.Interval).
      flint2_usteer_enabled:
        type: bool
        default: true
        description: >-
          Install and configure usteer for active AP-side band steering when true.
          Requires flint2_wireless.ieee80211k and bss_transition to be enabled.
      flint2_usteer_packages:
        type: list
        elements: str
        default:
          - usteer
          - luci-app-usteer
        description: Packages installed for usteer and its LuCI app.
      flint2_usteer:
        type: dict
        description: usteer UCI settings for band steering on the main SSIDs.
        options:
          network:
            type: str
            default: lan
            description: Logical network used for inter-AP usteer communication.
          local_mode:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Disable remote AP exchange when "1" (typical for a single AP doing
              2.4/5 GHz band steering). Use "0" when coordinating multiple APs.
          syslog:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: Log usteer messages to syslog.
          debug_level:
            type: str
            default: "2"
            description: usteer log verbosity (0=fatal … 5=all debug).
          ipv6:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: Use IPv6 for remote usteer exchange.
          band_steering_interval:
            type: str
            default: "30000"
            description: >-
              Attempt to steer clients to a higher frequency band every N ms.
              Use "0" to disable band steering.
          band_steering_min_snr:
            type: str
            default: "-60"
            description: >-
              Minimum SNR/signal (dBm) a client must sustain over
              band_steering_interval before being steered upward in band.
          band_steering_threshold:
            type: str
            default: "1"
            description: Minimum station-count delta between bands before steering.
          ssid_list:
            type: list
            elements: str
            default: []
            description: >-
              SSIDs to steer. When empty, flint2_wireless.ssid is used.
