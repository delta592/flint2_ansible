---
argument_specs:
  main:
    short_description: Configure a GL.iNet GL-MT6000 (Flint 2) running OpenWrt
    description:
      - Apply system, wireless, LAN bridge multicast, TLS, SSH, statistics, and verification settings to a Flint 2 device.
      - GL.iNet-specific UCI keys are used where required; TLS and wireless checks can be disabled for test environments.
    author: delta592
    options:
      flint2_hostname:
        type: str
        description: System hostname written to UCI system.@system[0].hostname.
      flint2_clock_hourcycle:
        type: str
        default: h23
        description: >-
          LuCI System → System → Time Format (system.@system[0].clock_hourcycle).
          Use h23 for 24-Hour Clock, h12 for 12-Hour Clock, or an empty string for Default.
      flint2_firmware_auto_update_check:
        type: str
        default: "0"
        choices:
          - "0"
          - "1"
        description: >-
          GL.iNet UI → System → Upgrade → Automatic Update Check
          (upgrade.general.upgrade_enable). Use "0" to disable background firmware update checks.
      flint2_network_mode:
        type: str
        description: Expected GL.iNet network mode in glconfig.general.mode (for example ap or router).
      flint2_lan_proto:
        type: str
        description: Expected LAN protocol in network.lan.proto (for example dhcp or static).
      flint2_wan_device:
        type: str
        description: Expected WAN uplink device name.
      flint2_bridge_enabled:
        type: bool
        default: true
        description: >-
          Apply and verify IGMP snooping and multicast querier on the LAN
          bridge device section (CLIENT_PERF E1/E2) when true.
      flint2_bridge_option_keys:
        type: list
        elements: str
        default:
          - igmp_snooping
          - multicast_querier
        description: >-
          Bridge device option keys copied from flint2_bridge onto the
          matching network device section.
      flint2_bridge:
        type: dict
        description: >-
          LAN bridge multicast settings. Applied to the network device
          section whose name and type match (never network.@device[N]).
        options:
          name:
            type: str
            default: br-lan
            description: Bridge device name (network device option name).
          igmp_snooping:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Enable IGMP/MLD snooping on the bridge (UCI
              network.<device>.igmp_snooping; sysfs multicast_snooping).
          multicast_querier:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Enable a multicast querier on the bridge so snooping
              memberships do not expire (UCI multicast_querier).
      flint2_fqdn:
        type: str
        description: Fully qualified domain name used for TLS verification and SNI checks.
      flint2_management_ip:
        type: str
        description: Expected management IP address for documentation and validation.
      flint2_packages_present:
        type: list
        elements: str
        default: []
        description: Packages to install with opkg or apk.
      flint2_packages_absent:
        type: list
        elements: str
        default: []
        description: Packages to remove with opkg or apk.
      flint2_wireless_device_option_keys:
        type: list
        elements: str
        default:
          - band
          - htmode
          - channel
          - ht_coex
          - hwmode
          - legacy_rates
          - require_mode
          - txpower
          - acs_exclude_dfs
          - cell_density
          - random_bssid
        description: Radio device option keys copied from each flint2_wireless.radios entry.
      flint2_wireless_iface_option_keys:
        type: list
        elements: str
        default:
          - ssid
          - encryption
          - key
          - ieee80211k
          - bss_transition
          - wpa_group_rekey
          - wds
          - mbo
          - random_bssid
        description: >-
          Shared wifi-iface option keys copied from flint2_wireless onto each
          main AP interface (ssid, encryption, key, ieee80211k, bss_transition,
          wpa_group_rekey, wds, mbo, random_bssid).
      flint2_wireless:
        type: dict
        description: Wireless SSID, encryption, key, roaming aids, and per-radio device settings.
        options:
          ssid:
            type: str
            description: Main wireless SSID applied to configured AP interfaces.
          encryption:
            type: str
            description: Wireless encryption mode (for example sae-mixed or none).
          key:
            type: str
            default: ""
            description: Wireless passphrase applied when non-empty.
          ieee80211k:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Enable 802.11k Radio Resource Measurement (neighbor and beacon
              reports) on main AP interfaces.
          bss_transition:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Enable 802.11v BSS Transition Management on main AP interfaces
              so clients can be steered between BSS/radios.
          wpa_group_rekey:
            type: str
            default: "86400"
            description: >-
              GTK rekeying interval in seconds (LuCI Network → Wireless →
              GTK rekeying; UCI wireless.<iface>.wpa_group_rekey).
          wds:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: >-
              4-address WDS mode on main AP interfaces. Keep "0" unless a
              WDS client or wireless bridge is intentionally used.
          mbo:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Enable Wi-Fi Agile Multiband (MBO) on main AP interfaces so
              capable clients can prefer the AP's advertised band/BSS.
          random_bssid:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: >-
              GL.iNet Enable Randomized BSSID on main AP interfaces (UCI
              wireless.<iface>.random_bssid). The GL.iNet UI reads this
              wifi-iface option; also set on wifi-device via radios[].random_bssid.
          radios:
            type: list
            elements: dict
            default: []
            description: Radio and interface definitions for wireless UCI device sections.
            options:
              device:
                type: str
                required: true
                description: UCI wireless device section name.
              iface:
                type: str
                required: true
                description: UCI wireless interface section name.
              band:
                type: str
                description: Radio band (2g or 5g).
              htmode:
                type: str
                description: >-
                  Channel width / Wi-Fi generation mode (for example HE20 for 2.4 GHz
                  20 MHz, HE40 for 20/40 MHz, HE80 for 5 GHz 80 MHz, HE160 for 160 MHz).
              channel:
                type: str
                description: >-
                  Fixed channel for the radio (for example "11" on 2.4 GHz). Use 1,
                  6, or 11 on 2.4 GHz to avoid overlapping with adjacent APs.
              ht_coex:
                type: str
                choices:
                  - "0"
                  - "1"
                description: >-
                  Enable 802.11n HT coexistence on the radio (wireless.<device>.ht_coex).
              hwmode:
                type: str
                description: Legacy hardware mode when applicable.
              legacy_rates:
                type: str
                description: Whether legacy rates are enabled.
              require_mode:
                type: str
                description: >-
                  Minimum client PHY mode (UCI wireless device option). On 2.4 GHz,
                  n maps to GL.iNet 11n/ax; on 5 GHz, n maps to 11n/ac/ax (use ac for
                  11ac/ax-only).
              txpower:
                type: str
                description: >-
                  Transmit power in dBm (UCI wireless.<device>.txpower). Lower 2.4 GHz
                  relative to 5 GHz to encourage dual-band clients onto 5 GHz.
              acs_exclude_dfs:
                type: str
                choices:
                  - "0"
                  - "1"
                description: >-
                  When ACS is used (channel auto), exclude DFS/radar channels.
                  Typically set on 5 GHz only; inert while channel is pinned.
              cell_density:
                type: str
                choices:
                  - "0"
                  - "1"
                  - "2"
                  - "3"
                description: >-
                  OpenWrt wifi-device cell_density. Higher values raise
                  basic_rates (for example "2" → 12/24 Mbit/s) to cut beacon
                  and multicast airtime.
              random_bssid:
                type: str
                choices:
                  - "0"
                  - "1"
                description: >-
                  GL.iNet Enable Randomized BSSID (UCI wireless.<device>.random_bssid).
                  Set "0" to keep a stable BSSID; "1" randomizes on reboot.
              iface_options:
                type: dict
                description: >-
                  Per-radio wifi-iface options that override or extend the shared
                  flint2_wireless keys for this interface only (for example
                  macfilter/maclist on 2.4 GHz, or ieee80211w). Scalar values are
                  set with UCI set; maclist must be a list and replaces the UCI
                  list in order. Per-radio keys take precedence over shared
                  flint2_wireless_iface_option_keys for the same option name.
                options:
                  macfilter:
                    type: str
                    choices:
                      - disable
                      - allow
                      - deny
                    description: >-
                      MAC address filter mode on this wifi-iface (band policy).
                      Use allow with maclist to admit only listed stations.
                  maclist:
                    type: list
                    elements: str
                    description: >-
                      Allowed or denied station MACs when macfilter is allow or
                      deny (UCI list option wireless.<iface>.maclist).
                  ieee80211w:
                    type: str
                    choices:
                      - "0"
                      - "1"
                      - "2"
                    description: >-
                      Per-radio PMF setting when it must differ from the shared
                      default (for example require PMF on 2.4 GHz only).
      flint2_wireless_guest_ifaces:
        type: list
        elements: str
        default: []
        description: Guest or IoT interface names expected to remain disabled.
      flint2_wireless_guest_option_keys:
        type: list
        elements: str
        default:
          - encryption
          - key
        description: >-
          Shared wifi-iface option keys copied from flint2_wireless_guest onto
          each guest/IoT interface (encryption, key).
      flint2_wireless_guest:
        type: dict
        description: >-
          Encryption and passphrase applied to guest/IoT wifi-ifaces so factory
          defaults (psk2 / goodlife) are replaced even while disabled.
        options:
          encryption:
            type: str
            default: sae-mixed
            description: Wireless encryption mode for guest/IoT interfaces.
          key:
            type: str
            default: ""
            description: Guest/IoT passphrase applied when non-empty.
      flint2_env_dir:
        type: path
        description: Control-node directory containing public certificates and SSH public keys.
      flint2_secrets_dir:
        type: path
        description: Control-node directory containing private keys and other secrets.
      flint2_wireless_key_file:
        type: str
        default: ARGUS_wifi_password.env
        description: >-
          Filename in flint2_secrets_dir containing the main Wi-Fi passphrase
          (single line, no KEY=value syntax).
      flint2_wireless_guest_key_file:
        type: str
        default: guest_passphrases.env
        description: >-
          Filename in flint2_secrets_dir containing the shared guest/IoT Wi-Fi
          passphrase (single line, no KEY=value syntax).
      flint2_tls_enabled:
        type: bool
        default: false
        description: Deploy TLS certificates to nginx and uHTTPd when true.
      flint2_tls_cert_files_dir:
        type: path
        description: Directory containing leaf and intermediate certificate files.
      flint2_tls_private_key_dir:
        type: path
        description: Directory containing the TLS private key file.
      flint2_tls_leaf_cert:
        type: str
        default: server.crt
        description: Leaf certificate filename in flint2_tls_cert_files_dir.
      flint2_tls_intermediate_cert:
        type: str
        default: intermediate.crt
        description: Intermediate certificate filename in flint2_tls_cert_files_dir.
      flint2_tls_private_key:
        type: str
        default: server.key
        description: Private key filename in flint2_tls_private_key_dir.
      flint2_tls_fullchain_name:
        type: str
        default: fullchain.crt
        description: Generated full-chain filename on the control node.
      flint2_tls_backup_suffix:
        type: str
        default: pre-ansible
        description: >-
          Suffix for the backup (<path>.<suffix>) of each installed certificate or key,
          taken on the router just before Ansible replaces that file.
      flint2_tls_nginx_cert_path:
        type: path
        default: /etc/nginx/nginx.cer
        description: Remote nginx certificate path on the router.
      flint2_tls_nginx_key_path:
        type: path
        default: /etc/nginx/nginx.key
        description: Remote nginx private key path on the router.
      flint2_tls_uhttpd_cert_path:
        type: path
        default: /etc/uhttpd.crt
        description: Remote uHTTPd certificate path on the router.
      flint2_tls_uhttpd_key_path:
        type: path
        default: /etc/uhttpd.key
        description: Remote uHTTPd private key path on the router.
      flint2_tls_verify_endpoints:
        type: bool
        default: false
        description: Validate served TLS fingerprints during the verify tag.
      flint2_tls_verify_from_client:
        type: bool
        default: true
        description: Compare remote TLS endpoints against the local leaf certificate.
      flint2_tls_verify_host:
        type: str
        description: Hostname or address used for client-side TLS verification.
      flint2_ssh_authorized_keys:
        type: list
        elements: str
        default: []
        description: SSH public keys installed for root (OpenSSH and/or Dropbear paths).
      flint2_ssh_backend:
        type: str
        default: openssh
        choices:
          - openssh
          - dropbear
        description: >-
          SSH server implementation. openssh is required to enforce KexAlgorithms,
          HostKeyAlgorithms, Ciphers, and MACs at runtime. dropbear cannot restrict
          those algorithms without a firmware rebuild.
      flint2_openssh_packages:
        type: list
        elements: str
        description: Packages installed when flint2_ssh_backend is openssh.
      flint2_sshd_config_d:
        type: str
        default: /etc/ssh/sshd_config.d
        description: Directory for OpenSSH drop-in configuration snippets.
      flint2_sshd_hardening_conf_name:
        type: str
        default: 99-flint2-hardening.conf
        description: Filename for the Flint 2 OpenSSH hardening drop-in.
      flint2_sshd_kex_algorithms:
        type: str
        description: sshd KexAlgorithms (ssh-audit OpenSSH 10.x PQ suite by default).
      flint2_sshd_host_key_algorithms:
        type: str
        description: sshd HostKeyAlgorithms.
      flint2_sshd_pubkey_accepted_algorithms:
        type: str
        description: sshd PubkeyAcceptedAlgorithms.
      flint2_sshd_ciphers:
        type: str
        description: sshd Ciphers.
      flint2_sshd_macs:
        type: str
        description: sshd MACs (prefer *-etm@openssh.com).
      flint2_sshd_password_authentication:
        type: str
        default: "no"
        choices:
          - "yes"
          - "no"
        description: sshd PasswordAuthentication.
      flint2_sshd_permit_root_login:
        type: str
        default: prohibit-password
        description: sshd PermitRootLogin.
      flint2_sshd_max_auth_tries:
        type: int
        default: 3
        description: sshd MaxAuthTries.
      flint2_sshd_login_grace_time:
        type: int
        default: 30
        description: sshd LoginGraceTime seconds.
      flint2_sshd_client_alive_interval:
        type: int
        default: 300
        description: sshd ClientAliveInterval seconds.
      flint2_sshd_client_alive_count_max:
        type: int
        default: 2
        description: sshd ClientAliveCountMax.
      flint2_sshd_per_source_max_startups:
        type: str
        default: ""
        description: >-
          sshd PerSourceMaxStartups. Empty omits the directive. Value 1 mitigates
          DHEat but false-positives ssh-audit rate tests and can lock out Ansible.
      flint2_sshd_max_startups:
        type: str
        default: "10:30:60"
        description: sshd MaxStartups.
      flint2_sshd_listen_address:
        type: str
        description: Optional sshd ListenAddress (e.g. management IP).
      flint2_dropbear_password_auth:
        type: str
        default: "off"
        choices:
          - "on"
          - "off"
        description: Value for dropbear.main.PasswordAuth.
      flint2_dropbear_root_password_auth:
        type: str
        default: "off"
        choices:
          - "on"
          - "off"
        description: Value for dropbear.main.RootPasswordAuth.
      flint2_dropbear_keyfiles:
        type: list
        elements: str
        default:
          - /etc/dropbear/dropbear_ed25519_host_key
        description: >-
          Host key paths written as dropbear.main.keyfile list entries when
          flint2_ssh_backend is dropbear.
      flint2_dropbear_max_auth_tries:
        type: str
        default: "3"
        description: Value for dropbear.main.MaxAuthTries.
      flint2_dropbear_idle_timeout:
        type: str
        default: "300"
        description: Value for dropbear.main.IdleTimeout (seconds; 0 disables).
      flint2_dropbear_mdns:
        type: str
        default: "0"
        choices:
          - "0"
          - "1"
        description: Value for dropbear.main.mdns (0 disables SSH mDNS advertisement).
      flint2_dropbear_interface:
        type: str
        description: >-
          Optional UCI network name for dropbear.main.Interface (e.g. lan). When
          unset, Dropbear keeps listening on all addresses.
      flint2_ssh_require_authorized_keys:
        type: bool
        default: true
        description: Fail verification when authorized_keys is missing or empty.
      flint2_verify_glinet_settings:
        type: bool
        default: true
        description: Validate GL.iNet-specific UCI settings such as glconfig.general.mode.
      flint2_verify_live_bridge:
        type: bool
        default: true
        description: >-
          When true, verify that /sys/class/net/<bridge>/bridge/multicast_snooping
          and multicast_querier match flint2_bridge after UCI apply. Disable in
          Molecule containers that have no kernel bridge.
      flint2_access_control_enabled:
        type: bool
        default: true
        description: Apply and verify GL.iNet Access Control settings when true.
      flint2_luci_enabled:
        type: bool
        default: true
        description: >-
          Install bundled GL.iNet LuCI packages and uhttpd-mod-ucode when true.
          OP25 ships LuCI as optional APKs; without this, uHTTPd returns 404 for /cgi-bin/luci/.
      flint2_nginx_gl_conf:
        type: path
        default: /etc/nginx/conf.d/gl.conf
        description: nginx configuration file containing GL.iNet admin panel listen directives.
      flint2_nginx_hardening_enabled:
        type: bool
        default: true
        description: >-
          Deploy F-07/F-09 security headers and server_tokens into gl-conf.d when true.
          Does not change vendor nginx `user root;` (accepted risk).
      flint2_nginx_gl_conf_d:
        type: path
        default: /etc/nginx/gl-conf.d
        description: Directory included by the GL.iNet admin server block for extra snippets.
      flint2_nginx_security_conf_name:
        type: str
        default: flint2-security-headers.conf
        description: Filename written under flint2_nginx_gl_conf_d for managed security headers.
      flint2_nginx_security_lua_path:
        type: path
        default: /usr/share/gl-ngx/flint2-security-headers.lua
        description: >-
          Lua file for header_filter_by_lua_file. Required because GL.iNet nginx is
          built with NGX_LUA_NO_BY_LUA_BLOCK (inline *_by_lua_block is unavailable).
      flint2_nginx_server_tokens:
        type: str
        default: "off"
        description: Value for nginx server_tokens in the managed gl-conf.d snippet.
      flint2_nginx_hsts_max_age:
        type: int
        default: 63072000
        description: Strict-Transport-Security max-age in seconds (default two years).
      flint2_nginx_verify_headers:
        type: bool
        default: true
        description: >-
          When true, verify checks the managed snippet on-device and HTTPS response headers
          from the control node (requires reachability to the admin HTTPS port).
      flint2_nginx_manage_ssl_ciphers:
        type: bool
        default: true
        description: >-
          Rewrite ssl_ciphers in flint2_nginx_gl_conf to an AEAD-only suite list (F-28).
          Required because nginx rejects a second ssl_ciphers in gl-conf.d.
      flint2_nginx_ssl_ciphers:
        type: str
        default: >-
          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
        description: >-
          OpenSSL TLS 1.2 cipher string written to gl.conf. TLS 1.3 suites are not
          controlled by ssl_ciphers and remain AEAD-only.
      flint2_access_control:
        type: dict
        description: GL.iNet Access Control page settings for admin panel, LuCI, and SSH.
        options:
          admin:
            type: dict
            description: GL.iNet admin panel ports, Force HTTPS, and auto-logout settings.
            options:
              http_port:
                type: int
                description: Admin panel HTTP port written to nginx gl.conf.
              https_port:
                type: int
                description: Admin panel HTTPS port written to nginx gl.conf.
              redirect_https:
                type: str
                choices:
                  - "0"
                  - "1"
                description: oui-httpd.main.redirect_https Force HTTPS setting.
              session_timeout_minutes:
                type: int
                description: Admin auto-logout interval in minutes (stored as seconds in oui-httpd.main.session_timeout).
          luci:
            type: dict
            description: LuCI uHTTPd listener and Force HTTPS settings.
            options:
              http_port:
                type: int
                description: LuCI HTTP port (uhttpd.main.listen_http).
              https_port:
                type: int
                description: LuCI HTTPS port (uhttpd.main.listen_https).
              redirect_https:
                type: str
                choices:
                  - "0"
                  - "1"
                description: uhttpd.main.redirect_https Force HTTPS setting.
          ssh:
            type: dict
            description: Dropbear SSH enablement and port settings.
            options:
              enabled:
                type: str
                choices:
                  - "0"
                  - "1"
                description: dropbear.main.enable SSH service toggle.
              port:
                type: int
                description: dropbear.main.Port SSH listen port.
      flint2_ntp_enabled:
        type: bool
        default: true
        description: Apply and verify NTP time synchronization settings when true.
      flint2_ntp:
        type: dict
        description: Upstream NTP server settings for chronyd (GL.iNet 4.8.4+) or sysntpd.
        options:
          servers:
            type: list
            elements: str
            default:
              - pool.ntp.org
            description: Upstream NTP pool or server hostnames.
          use_dhcp:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: system.ntp.use_dhcp for sysntpd; ignored on chronyd.
          iburst:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: chrony.flint2.iburst setting for faster initial sync.
          enable_server:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: system.ntp.enable_server for sysntpd LAN time serving.
      flint2_statistics_enabled:
        type: bool
        default: true
        description: >-
          Install luci-app-statistics/collectd and enable thermal and sensors
          plugins when true. Graphs appear in LuCI under Statistics → Graphs.
      flint2_statistics_packages:
        type: list
        elements: str
        default:
          - luci-app-statistics
          - collectd
          - collectd-mod-rrdtool
          - collectd-mod-thermal
          - collectd-mod-sensors
        description: Packages installed for LuCI Statistics and thermal collection.
      flint2_statistics_plugins:
        type: list
        elements: str
        default:
          - collectd_rrdtool
          - collectd_thermal
          - collectd_sensors
        description: luci_statistics UCI sections whose enable option is set to 1.
      flint2_statistics_interval:
        type: int
        default: 30
        description: collectd read interval in seconds (luci_statistics.collectd.Interval).
      flint2_usteer_enabled:
        type: bool
        default: true
        description: >-
          Install and configure usteer for active AP-side band steering when true.
          Requires flint2_wireless.ieee80211k and bss_transition to be enabled.
      flint2_usteer_packages:
        type: list
        elements: str
        default:
          - usteer
          - luci-app-usteer
        description: Packages installed for usteer and its LuCI app.
      flint2_usteer:
        type: dict
        description: usteer UCI settings for band steering on the main SSIDs.
        options:
          network:
            type: str
            default: lan
            description: Logical network used for inter-AP usteer communication.
          local_mode:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              Disable remote AP exchange when "1" (typical for a single AP doing
              2.4/5 GHz band steering). Use "0" when coordinating multiple APs.
          syslog:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: Log usteer messages to syslog.
          debug_level:
            type: str
            default: "2"
            description: usteer log verbosity (0=fatal … 5=all debug).
          ipv6:
            type: str
            default: "0"
            choices:
              - "0"
              - "1"
            description: Use IPv6 for remote usteer exchange.
          assoc_steering:
            type: str
            default: "1"
            choices:
              - "0"
              - "1"
            description: >-
              When "1", refuse association on a lower band if usteer has already
              seen the same client probing on a higher band (proactive band
              steering). Required for clients that ignore 802.11v BTM.
          band_steering_interval:
            type: str
            default: "10000"
            description: >-
              Attempt to steer clients to a higher frequency band every N ms.
              Use "0" to disable band steering.
          band_steering_min_snr:
            type: str
            default: "15"
            description: >-
              Minimum SNR (dB) a client must have on the lower band before
              usteer steers it upward. A negative value effectively never gates.
          band_steering_threshold:
            type: str
            default: "1"
            description: Minimum station-count delta between bands before steering.
          ssid_list:
            type: list
            elements: str
            default: []
            description: >-
              SSIDs to steer. When empty, flint2_wireless.ssid is used.
