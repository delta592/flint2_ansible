---
- name: Prepare OpenWrt test host
  hosts: all
  gather_facts: false
  vars_files:
    - molecule_vars.yml
  tasks:
    - name: Wait for OpenWrt container to accept UCI commands
      community.openwrt.uci:
        command: get
        key: system.@system[0].hostname
      register: flint2_molecule_prepare
      until: flint2_molecule_prepare is succeeded
      retries: 12
      delay: 5
      changed_when: false

    # In an unprivileged container netifd blocks forever on a netlink reply, so
    # every netifd ubus call (the network.sh helpers in the chronyd, usteer, and
    # Dropbear init scripts) waits out a 30 s ubus timeout: about 7 minutes per
    # molecule test. Removing the procd service (no ifdown hooks, no respawn) makes
    # those calls fail fast. Nothing here needs netifd: the bridge handler skips
    # when sysfs is absent, and the rootfs has no /sbin/wifi.
    - name: Stop netifd, which hangs in an unprivileged container
      community.openwrt.command:
        cmd: |
          ubus call service delete '{"name":"network"}' || true
          i=0
          while pidof netifd >/dev/null && [ "$i" -lt 30 ]; do
            sleep 1
            i=$((i + 1))
          done
          ! pidof netifd >/dev/null
        uses_shell: true
      changed_when: false

    - name: Ensure wireless UCI config exists in the container rootfs
      community.openwrt.command:
        cmd: test -f /etc/config/wireless || touch /etc/config/wireless
        uses_shell: true
      changed_when: false

    - name: Seed synthetic Flint 2 wireless device sections
      community.openwrt.uci:
        command: set
        key: "wireless.{{ item }}"
        value: wifi-device
      loop: "{{ flint2_wireless.radios | map(attribute='device') | list | unique }}"

    - name: Seed synthetic main AP wireless interface sections
      community.openwrt.uci:
        command: set
        key: "wireless.{{ item.iface }}"
        value: wifi-iface
      loop: "{{ flint2_wireless.radios }}"

    - name: Link main AP interfaces to synthetic radio devices
      community.openwrt.uci:
        command: set
        key: "wireless.{{ item.iface }}.device"
        value: "{{ item.device }}"
      loop: "{{ flint2_wireless.radios }}"

    - name: Seed synthetic guest and IoT wireless interface sections
      community.openwrt.uci:
        command: set
        key: "wireless.{{ item }}"
        value: wifi-iface
      loop: "{{ flint2_wireless_guest_ifaces }}"

    - name: Keep guest and IoT wireless interfaces disabled in test fixtures
      community.openwrt.uci:
        command: set
        key: "wireless.{{ item }}.disabled"
        value: "1"
      loop: "{{ flint2_wireless_guest_ifaces }}"

    - name: Commit seeded wireless UCI configuration
      community.openwrt.uci:
        command: commit
        config: wireless

    - name: Ensure upgrade UCI config exists in the container rootfs
      community.openwrt.command:
        cmd: test -f /etc/config/upgrade || touch /etc/config/upgrade
        uses_shell: true
      changed_when: false

    - name: Seed synthetic GL.iNet upgrade service section
      community.openwrt.uci:
        command: set
        key: upgrade.general
        value: service

    - name: Seed GL.iNet Automatic Update Check enabled before converge
      community.openwrt.uci:
        command: set
        key: upgrade.general.upgrade_enable
        value: "1"

    - name: Commit seeded upgrade UCI configuration
      community.openwrt.uci:
        command: commit
        config: upgrade

    - name: Ensure network UCI config exists in the container rootfs
      community.openwrt.command:
        cmd: test -f /etc/config/network || touch /etc/config/network
        uses_shell: true
      changed_when: false

    - name: Seed synthetic br-lan bridge device section
      community.openwrt.uci:
        command: section
        config: network
        type: device
        find:
          name: "{{ flint2_bridge.name }}"
        set_find: true
        value:
          type: bridge

    - name: Commit seeded network UCI configuration
      community.openwrt.uci:
        command: commit
        config: network

    # GL.iNet firmware 4.8.4+ syncs time with chronyd; converge its UCI path, not sysntpd.
    - name: Install chrony so NTP converges through the chronyd backend
      community.openwrt.apk:
        name: chrony
        state: present
        update_cache: true

    - name: Ensure GL.iNet oui-httpd UCI config exists in the container rootfs
      community.openwrt.command:
        cmd: test -f /etc/config/oui-httpd || touch /etc/config/oui-httpd
        uses_shell: true
      changed_when: false

    - name: Seed synthetic GL.iNet oui-httpd main section
      community.openwrt.uci:
        command: set
        key: oui-httpd.main
        value: oui-httpd

    - name: Commit seeded oui-httpd UCI configuration
      community.openwrt.uci:
        command: commit
        config: oui-httpd

    - name: Ensure GL.iNet nginx conf.d directory exists
      community.openwrt.file:
        path: /etc/nginx/conf.d
        state: directory
        mode: "0755"

    - name: Seed synthetic GL.iNet admin panel nginx listen directives
      community.openwrt.copy:
        dest: /etc/nginx/conf.d/gl.conf
        content: |
          server {
              listen 80;
              listen [::]:80;
              listen 443 ssl;
              listen [::]:443 ssl;
          }
        mode: "0644"

    # Throwaway TLS material for tls.yml: a leaf matching its key, plus an
    # unrelated self-signed "intermediate" (the role concatenates, it does not
    # validate the chain).
    - name: Create TLS fixture directory on the control node
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls"
        state: directory
        mode: "0700"

    - name: Generate TLS fixture certificates on the control node
      delegate_to: localhost
      run_once: true
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 30
          -subj /CN={{ item.cn }}
          -keyout {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls/{{ item.key }}
          -out {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls/{{ item.cert }}
        creates: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls/{{ item.cert }}"
      loop:
        - cn: molecule-flint2.test
          cert: server.crt
          key: server.key
        - cn: molecule-intermediate.test
          cert: intermediate.crt
          key: intermediate.key
