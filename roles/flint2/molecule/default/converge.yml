---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    flint2_hostname: molecule-flint2
    flint2_tls_enabled: false
    flint2_tls_verify_endpoints: false
    flint2_tls_verify_from_client: false
    flint2_ssh_authorized_keys:
      - >-
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG1vbGVjdWxlLXRlc3Qta2V5
        molecule@flint2-ansible
    flint2_wireless:
      ssid: MOLECULE
      encryption: none
      key: ""
      radios: []
    flint2_wireless_guest_ifaces: []
  roles:
    - role: community.openwrt.init
  tasks:
    - name: Configure Flint 2 system settings
      ansible.builtin.import_role:
        name: flint2
        tasks_from: system.yml

    - name: Configure Flint 2 SSH access
      ansible.builtin.import_role:
        name: flint2
        tasks_from: ssh.yml
