---
- name: Converge
  hosts: all
  gather_facts: false
  vars_files:
    - molecule_vars.yml
  handlers:
    - name: Reload wifi
      community.openwrt.command:
        cmd: /bin/true
        uses_shell: true
  tasks:
    - name: Manage Flint 2 packages
      ansible.builtin.import_role:
        name: flint2
        tasks_from: packages.yml

    - name: Configure Flint 2 system settings
      ansible.builtin.import_role:
        name: flint2
        tasks_from: system.yml

    - name: Configure Flint 2 NTP time synchronization
      ansible.builtin.import_role:
        name: flint2
        tasks_from: ntp.yml

    - name: Configure Flint 2 wireless networks
      ansible.builtin.import_role:
        name: flint2
        tasks_from: wireless.yml

    - name: Configure Flint 2 SSH access
      ansible.builtin.import_role:
        name: flint2
        tasks_from: ssh.yml
