---
# Run the role through its main entry point, like playbooks/site.yml, so converge
# exercises tasks/main.yml (tag and when wiring), argument_specs validation, UCI
# apply + handlers, and the role's own verify.yml. Areas that need GL.iNet-only
# files (nginx hardening, live radio/bridge checks) are disabled in molecule_vars.yml.
- name: Converge
  hosts: all
  gather_facts: false
  vars_files:
    - molecule_vars.yml
  roles:
    - role: flint2
