---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
    collections-path: "${MOLECULE_PROJECT_DIRECTORY}/../../collections"

driver:
  name: default

platforms: []

scenario:
  test_sequence:
    - create
    - prepare
    - converge
    - idempotence
    # Dry run on the converged host: every task must tolerate --check (skipped
    # community.openwrt.command results must not break later tasks).
    - check
    - verify
    - destroy

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # Converge and idempotence skip the role's own verify include (tasks/main.yml,
    # tagged verify); verify.yml runs those same checks once, right after --check.
    # Its include_role is untagged, so this skip does not touch it.
    ANSIBLE_SKIP_TAGS: verify
    # macOS: the docker_api connection's Docker SDK otherwise crashes forked
    # workers ("A worker was found in a dead state"). No effect on Linux.
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
  config_options:
    defaults:
      collections_path: "${MOLECULE_PROJECT_DIRECTORY}/../../collections"
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    directory: ${MOLECULE_EPHEMERAL_DIRECTORY}/inventory
    group_vars:
      all:
        openwrt_gather_facts: false
        openwrt_install_recommended_packages: false
        openwrt_package_manager: apk
        ansible_remote_tmp: /tmp
        ansible_scp_if_ssh: true
        ansible_scp_extra_args: "-O"
  playbooks:
    create: ../../../../tests/molecule/create.yml
    destroy: ../../../../tests/molecule/destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible
