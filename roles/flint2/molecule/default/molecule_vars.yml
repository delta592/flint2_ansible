---
# Shared variables for Molecule converge and verify playbooks.
flint2_hostname: molecule-flint2
flint2_firmware_auto_update_check: "0"
flint2_verify_glinet_settings: false
flint2_verify_live_hostname: false
flint2_verify_live_wireless: false
flint2_verify_live_bridge: false
flint2_luci_enabled: false
flint2_access_control_enabled: false
flint2_statistics_enabled: false
flint2_usteer_enabled: false
flint2_lan_proto: static
flint2_tls_enabled: false
flint2_tls_verify_endpoints: false
flint2_tls_verify_from_client: false
flint2_nginx_hardening_enabled: false
flint2_nginx_verify_headers: false
flint2_nginx_manage_ssl_ciphers: false
flint2_ssh_authorized_keys:
  - >-
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG1vbGVjdWxlLXRlc3Qta2V5
    molecule@flint2-ansible
flint2_bridge_enabled: true
flint2_bridge_option_keys:
  - igmp_snooping
  - multicast_querier
flint2_bridge:
  name: br-lan
  igmp_snooping: "1"
  multicast_querier: "1"
flint2_dropbear_password_auth: "off"
flint2_dropbear_root_password_auth: "off"
flint2_ssh_require_authorized_keys: true
flint2_ssh_backend: dropbear
flint2_dropbear_keyfiles:
  - /etc/dropbear/dropbear_ed25519_host_key
flint2_dropbear_max_auth_tries: "3"
flint2_dropbear_idle_timeout: "300"
flint2_dropbear_mdns: "0"
flint2_packages_present: []
flint2_packages_absent: []
flint2_wireless_device_option_keys:
  - band
  - htmode
  - channel
  - ht_coex
  - hwmode
  - legacy_rates
  - require_mode
  - txpower
  - acs_exclude_dfs
  - cell_density
flint2_wireless_iface_option_keys:
  - ssid
  - encryption
  - key
  - ieee80211k
  - bss_transition
  - wpa_group_rekey
  - wds
  - mbo
flint2_wireless:
  ssid: MOLECULE
  encryption: sae-mixed
  key: molecule-test-key
  ieee80211k: "1"
  bss_transition: "1"
  wpa_group_rekey: "86400"
  wds: "0"
  mbo: "1"
  radios:
    # F-06 / F-19 / B2 / B8: HE20 ch 6, cell_density 2, reduced txpower
    # B6 / B9: ecobee allowlist + require PMF on 2.4 GHz
    - device: radio0
      iface: default_radio0
      band: 2g
      htmode: HE20
      channel: "6"
      ht_coex: "1"
      hwmode: 11g
      legacy_rates: "0"
      require_mode: n
      txpower: "15"
      cell_density: "2"
      iface_options:
        macfilter: allow
        maclist:
          - "44:61:32:21:92:66"
        ieee80211w: "2"
    # F-08: 80 MHz on channel 36 (require_mode n); exclude DFS if ACS runs
    - device: radio1
      iface: default_radio1
      band: 5g
      htmode: HE80
      channel: "36"
      ht_coex: "1"
      hwmode: 11a
      require_mode: n
      acs_exclude_dfs: "1"
flint2_wireless_guest_ifaces:
  - guest2g
  - guest5g
  - iot2g
  - iot5g
flint2_wireless_guest_option_keys:
  - encryption
  - key
flint2_wireless_guest:
  encryption: sae-mixed
  key: molecule-guest-test-key
