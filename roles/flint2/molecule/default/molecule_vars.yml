---
# Shared variables for Molecule converge and verify playbooks.
flint2_hostname: molecule-flint2
flint2_firmware_auto_update_check: "0"
flint2_verify_glinet_settings: false
flint2_verify_live_hostname: false
flint2_verify_live_wireless: false
flint2_luci_enabled: false
flint2_access_control_enabled: false
flint2_lan_proto: static
flint2_tls_enabled: false
flint2_tls_verify_endpoints: false
flint2_tls_verify_from_client: false
flint2_ssh_authorized_keys:
  - >-
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG1vbGVjdWxlLXRlc3Qta2V5
    molecule@flint2-ansible
flint2_dropbear_password_auth: "off"
flint2_dropbear_root_password_auth: "off"
flint2_ssh_require_authorized_keys: true
flint2_packages_present: []
flint2_packages_absent: []
flint2_wireless_device_option_keys:
  - band
  - htmode
  - hwmode
  - legacy_rates
  - require_mode
flint2_wireless:
  ssid: MOLECULE
  encryption: sae-mixed
  key: molecule-test-key
  radios:
    # GL.iNet Mode 11n/ax (require_mode n)
    - device: radio0
      iface: default_radio0
      band: 2g
      htmode: HE40
      hwmode: 11g
      legacy_rates: "0"
      require_mode: n
    # GL.iNet Mode 11n/ac/ax (require_mode n)
    - device: radio1
      iface: default_radio1
      band: 5g
      htmode: HE160
      hwmode: 11a
      require_mode: n
flint2_wireless_guest_ifaces:
  - guest2g
  - guest5g
  - iot2g
  - iot5g
