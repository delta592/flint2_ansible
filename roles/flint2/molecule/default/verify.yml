---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - molecule_vars.yml
  tasks:
    - name: Run Flint 2 verification tasks
      ansible.builtin.include_role:
        name: flint2
        tasks_from: verify.yml

    - name: Read GL.iNet firmware Automatic Update Check setting
      when: flint2_firmware_auto_update_check is defined
      community.openwrt.uci:
        command: get
        key: upgrade.general.upgrade_enable
      register: flint2_molecule_verify_firmware_auto_update_check
      changed_when: false

    - name: Assert GL.iNet firmware Automatic Update Check matches desired value
      when: flint2_firmware_auto_update_check is defined
      ansible.builtin.assert:
        that:
          - flint2_molecule_verify_firmware_auto_update_check.result == flint2_firmware_auto_update_check
        fail_msg: >-
          upgrade.general.upgrade_enable is
          '{{ flint2_molecule_verify_firmware_auto_update_check.result }}',
          expected '{{ flint2_firmware_auto_update_check }}'

    - name: Read configured wireless encryption on main AP interfaces
      community.openwrt.uci:
        command: get
        key: "wireless.{{ item.iface }}.encryption"
      loop: "{{ flint2_wireless.radios }}"
      register: flint2_molecule_verify_wireless_encryption
      changed_when: false

    - name: Assert wireless encryption matches desired value
      ansible.builtin.assert:
        that:
          - item.result == flint2_wireless.encryption
        fail_msg: >-
          encryption on {{ item.item.iface }} is '{{ item.result }}',
          expected '{{ flint2_wireless.encryption }}'
      loop: "{{ flint2_molecule_verify_wireless_encryption.results }}"
      loop_control:
        label: "{{ item.item.iface }}"

    - name: Read configured wireless radio device settings
      community.openwrt.uci:
        command: get
        key: "wireless.{{ item.0.device }}.{{ item.1 }}"
      loop: "{{ flint2_wireless.radios | product(flint2_wireless_device_option_keys) | list }}"
      when: item.0[item.1] is defined
      register: flint2_molecule_verify_radio_options
      changed_when: false

    - name: Assert wireless radio device settings match desired values
      ansible.builtin.assert:
        that:
          - item.result == item.item.0[item.item.1]
        fail_msg: >-
          wireless.{{ item.item.0.device }}.{{ item.item.1 }} is '{{ item.result }}',
          expected '{{ item.item.0[item.item.1] }}'
      loop: "{{ flint2_molecule_verify_radio_options.results | default([]) | selectattr('skipped', 'undefined') | list }}"
      when: flint2_molecule_verify_radio_options.results | default([]) | length > 0
      loop_control:
        label: "{{ item.item.0.device }}.{{ item.item.1 }}"

    - name: Read vendor chrony pool and DHCP NTP server disabled state
      community.openwrt.uci:
        command: get
        key: "{{ item }}"
      loop:
        - chrony.@pool[0].disabled
        - chrony.@dhcp_ntp_server[0].disabled
      register: flint2_molecule_verify_chrony_disabled
      changed_when: false

    - name: Assert vendor chrony pool and DHCP NTP servers are disabled
      ansible.builtin.assert:
        that:
          - item.result == "1"
        fail_msg: "{{ item.item }} is '{{ item.result }}', expected '1'"
      loop: "{{ flint2_molecule_verify_chrony_disabled.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Expected ports are the role defaults for flint2_access_control.luci.
    - name: Read uHTTPd options managed for LuCI
      community.openwrt.uci:
        command: get
        key: "uhttpd.main.{{ item.option }}"
      loop:
        - option: inited
          expected: ["1"]
        - option: enabled
          expected: ["1"]
        - option: rfc1918_filter
          expected: ["0"]
        - option: listen_http
          expected: ["0.0.0.0:8080", "[::]:8080"]
        - option: listen_https
          expected: ["0.0.0.0:8443", "[::]:8443"]
      loop_control:
        label: "uhttpd.main.{{ item.option }}"
      register: flint2_molecule_verify_uhttpd
      changed_when: false

    - name: Assert uHTTPd options managed for LuCI match desired values
      ansible.builtin.assert:
        that:
          - item.result_list == item.item.expected
        fail_msg: >-
          uhttpd.main.{{ item.item.option }} is {{ item.result_list | default([]) }},
          expected {{ item.item.expected }}
      loop: "{{ flint2_molecule_verify_uhttpd.results }}"
      loop_control:
        label: "uhttpd.main.{{ item.item.option }}"

    - name: Read uHTTPd LuCI handler prefixes
      community.openwrt.uci:
        command: get
        key: "uhttpd.main.{{ item }}"
      loop:
        - ucode_prefix
        - lua_prefix
      register: flint2_molecule_verify_uhttpd_prefixes
      changed_when: false
      failed_when: false

    - name: Assert uHTTPd serves LuCI through ucode only
      ansible.builtin.assert:
        that:
          - >-
            '/cgi-bin/luci=/usr/share/ucode/luci/uhttpd.uc'
            in (flint2_molecule_verify_uhttpd_prefixes.results[0].result_list | default([]))
          - flint2_molecule_verify_uhttpd_prefixes.results[1].result_list is not defined
        fail_msg: >-
          ucode_prefix is {{ flint2_molecule_verify_uhttpd_prefixes.results[0].result_list | default([]) }},
          lua_prefix is {{ flint2_molecule_verify_uhttpd_prefixes.results[1].result_list | default('unset') }}

    - name: Read LuCI English language entry
      community.openwrt.uci:
        command: get
        key: luci.languages.en
      register: flint2_molecule_verify_luci_language
      changed_when: false

    - name: Assert LuCI English language is registered
      ansible.builtin.assert:
        that:
          - flint2_molecule_verify_luci_language.result == "English"
        fail_msg: "luci.languages.en is '{{ flint2_molecule_verify_luci_language.result }}', expected 'English'"

