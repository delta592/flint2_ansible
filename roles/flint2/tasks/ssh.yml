---
# SSH hardening. Dropbear cannot restrict KexAlgorithms/Ciphers/MACs at runtime
# (compile-time only), so flint2_ssh_backend=openssh installs OpenSSH and applies
# the strongest algorithms still compatible with OpenSSH 7.4+ / Dropbear 2020.79+.

- name: Configure Dropbear SSH backend
  when: flint2_ssh_backend == 'dropbear'
  ansible.builtin.include_tasks:
    file: ssh_dropbear.yml
    apply:
      tags: [ssh]
  tags: [ssh]

- name: Configure OpenSSH SSH backend
  when: flint2_ssh_backend == 'openssh'
  ansible.builtin.include_tasks:
    file: ssh_openssh.yml
    apply:
      tags: [ssh]
  tags: [ssh]
