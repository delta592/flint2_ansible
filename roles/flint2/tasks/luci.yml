---
- name: Install bundled GL.iNet LuCI packages
  when:
    - flint2_luci_enabled | default(true) | bool
    - openwrt_package_manager == "apk"
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      if apk info -e luci-base >/dev/null 2>&1; then
        exit 0
      fi
      pkgs=""
      for dir in /etc/luci_apks /etc/luci_ipks; do
        [ -d "$dir" ] || continue
        for apk_file in "$dir"/*.apk; do
          [ -e "$apk_file" ] || continue
          pkgs="$pkgs $apk_file"
        done
      done
      if [ -z "$pkgs" ]; then
        echo "Bundled LuCI APKs not found under /etc/luci_apks or /etc/luci_ipks" >&2
        exit 1
      fi
      # shellcheck disable=SC2086
      apk add --allow-untrusted $pkgs
      echo changed
    uses_shell: true
  register: flint2_luci_bundled_install
  changed_when: flint2_luci_bundled_install.stdout is search('changed')

- name: Install bundled GL.iNet LuCI packages with opkg
  when:
    - flint2_luci_enabled | default(true) | bool
    - openwrt_package_manager == "opkg"
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      if opkg list-installed luci-base >/dev/null 2>&1; then
        exit 0
      fi
      if [ ! -d /etc/luci_ipks ]; then
        echo "Bundled LuCI IPKs not found under /etc/luci_ipks" >&2
        exit 1
      fi
      opkg install /etc/luci_ipks/*.ipk -f /etc/luci_ipks/feeds.conf
      echo changed
    uses_shell: true
  register: flint2_luci_bundled_install_opkg
  changed_when: flint2_luci_bundled_install_opkg.stdout is search('changed')

- name: Install uHTTPd ucode module for LuCI
  when:
    - flint2_luci_enabled | default(true) | bool
    - openwrt_package_manager == "apk"
  community.openwrt.apk:
    name: uhttpd-mod-ucode
    state: present

- name: Install uHTTPd ucode module for LuCI with opkg
  when:
    - flint2_luci_enabled | default(true) | bool
    - openwrt_package_manager == "opkg"
  community.openwrt.opkg:
    name: uhttpd-mod-ucode
    state: present

- name: Configure uHTTPd for LuCI
  when: flint2_luci_enabled | default(true) | bool
  block:
    - name: Check for LuCI ucode uHTTPd handler
      community.openwrt.stat:
        path: /usr/share/ucode/luci/uhttpd.uc
      register: flint2_luci_ucode_handler

    - name: Check for legacy LuCI Lua uHTTPd handler
      community.openwrt.stat:
        path: /usr/lib/lua/luci/sgi/uhttpd.lua
      register: flint2_luci_lua_handler

    - name: Register LuCI ucode handler with uHTTPd
      when: flint2_luci_ucode_handler.stat.exists
      community.openwrt.uci:
        command: add_list
        key: uhttpd.main.ucode_prefix
        value: /cgi-bin/luci=/usr/share/ucode/luci/uhttpd.uc
        unique: true

    # Drop lua_prefix when the Lua SGI handler it points at is not installed.
    - name: Remove stale LuCI Lua handler from uHTTPd
      when: not flint2_luci_lua_handler.stat.exists
      community.openwrt.uci:
        command: absent
        key: uhttpd.main.lua_prefix

    - name: Enable uHTTPd and disable its RFC1918 request filter
      community.openwrt.uci:
        command: set
        key: uhttpd.main
        value:
          inited: "1"
          enabled: "1"
          rfc1918_filter: "0"

    - name: Check for LuCI UCI config
      community.openwrt.stat:
        path: /etc/config/luci
      register: flint2_luci_config

    - name: Read LuCI English language entry
      when: flint2_luci_config.stat.exists
      community.openwrt.uci:
        command: get
        key: luci.languages.en
      register: flint2_luci_language_en
      changed_when: false
      failed_when: false

    - name: Register LuCI English language
      when:
        - flint2_luci_config.stat.exists
        - flint2_luci_language_en.result_list | default([]) | join('') | length == 0
      community.openwrt.uci:
        command: set
        key: luci.languages.en
        value: English

- name: Enable rpcd for LuCI
  when: flint2_luci_enabled | default(true) | bool
  community.openwrt.command:
    cmd: /etc/init.d/rpcd enable
    uses_shell: true
  changed_when: false
