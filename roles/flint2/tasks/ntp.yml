---
# chronyd (GL.iNet 4.8.4+) when its UCI config and init script exist; otherwise sysntpd (system.ntp).
- name: Configure NTP time servers
  when: flint2_ntp_enabled | default(true) | bool
  block:
    - name: Check for chrony UCI config
      community.openwrt.stat:
        path: /etc/config/chrony
      register: flint2_ntp_chrony_config

    - name: Check for chronyd init script
      community.openwrt.stat:
        path: /etc/init.d/chronyd
      register: flint2_ntp_chronyd_init

    - name: Read sysntpd timeserver section
      community.openwrt.uci:
        command: get
        key: system.ntp
      register: flint2_ntp_system_section
      changed_when: false
      failed_when: false

    - name: Select NTP configuration backend
      ansible.builtin.set_fact:
        flint2_ntp_backend: >-
          {{
            'chrony'
            if (flint2_ntp_chrony_config.stat.exists and flint2_ntp_chronyd_init.stat.executable | default(false))
            else ('sysntpd' if flint2_ntp_system_section.result_list is defined else 'unsupported')
          }}

    - name: Assert a supported NTP configuration exists
      ansible.builtin.assert:
        that:
          - flint2_ntp_backend != 'unsupported'
        fail_msg: No supported NTP configuration found (neither chrony nor system.ntp)

    - name: Configure chronyd upstream pool
      when: flint2_ntp_backend == 'chrony'
      block:
        - name: Read vendor chrony pool hostname
          community.openwrt.uci:
            command: get
            key: chrony.@pool[0].hostname
          register: flint2_ntp_chrony_vendor_pool
          changed_when: false
          failed_when: false

        - name: Disable vendor chrony pool
          when: flint2_ntp_chrony_vendor_pool.result_list is defined
          community.openwrt.uci:
            command: set
            key: chrony.@pool[0].disabled
            value: "1"

        - name: Read chrony DHCP NTP server section
          community.openwrt.uci:
            command: get
            key: chrony.@dhcp_ntp_server[0]
          register: flint2_ntp_chrony_dhcp_server
          changed_when: false
          failed_when: false

        - name: Disable chrony DHCP-provided NTP servers
          when: flint2_ntp_chrony_dhcp_server.result_list is defined
          community.openwrt.uci:
            command: set
            key: chrony.@dhcp_ntp_server[0].disabled
            value: "1"

        - name: Configure managed chrony pool
          community.openwrt.uci:
            command: section
            config: chrony
            type: pool
            name: flint2
            value:
              hostname: "{{ flint2_ntp.servers[0] }}"
              iburst: "{{ flint2_ntp.iburst | default('1') }}"
              disabled: "0"

    - name: Configure sysntpd upstream servers
      when: flint2_ntp_backend == 'sysntpd'
      block:
        - name: Set sysntpd upstream server list
          community.openwrt.uci:
            command: set
            key: system.ntp.server
            value: "{{ flint2_ntp.servers }}"

        - name: Enable sysntpd and set DHCP-provided server usage
          community.openwrt.uci:
            command: set
            key: system.ntp
            value:
              enabled: "1"
              use_dhcp: "{{ flint2_ntp.use_dhcp | default('0') }}"

        - name: Read sysntpd LAN time server setting
          community.openwrt.uci:
            command: get
            key: system.ntp.enable_server
          register: flint2_ntp_enable_server
          changed_when: false
          failed_when: false

        - name: Set sysntpd LAN time server setting
          when: flint2_ntp_enable_server.result_list is defined
          community.openwrt.uci:
            command: set
            key: system.ntp.enable_server
            value: "{{ flint2_ntp.enable_server | default('0') }}"
