---
# Always commit the whole UCI overlay unconditionally, so handlers flushed below
# never reload a service against uncommitted configuration.
- name: Commit all pending UCI configuration
  tags: [always]
  community.openwrt.uci:
    command: commit

- name: Read UCI changes left after commit
  tags: [always]
  community.openwrt.uci:
    command: changes
  register: flint2_uci_remaining
  changed_when: false

- name: Assert uci commit left no pending changes
  tags: [always]
  ansible.builtin.assert:
    that:
      - flint2_uci_remaining.result | default('') | trim | length == 0
    fail_msg: "uci commit left pending changes: {{ flint2_uci_remaining.result }}"

# Restart only the services whose configuration changed (handlers/main.yml),
# before verification reads live state.
- name: Reload services whose configuration changed
  tags: [always]
  ansible.builtin.meta: flush_handlers
