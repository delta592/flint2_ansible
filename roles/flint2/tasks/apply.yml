---
# Always persist the UCI overlay. Do not gate commit on
# `uci changes | grep -q` under `set -o pipefail`: grep -q closes the pipe on
# the first match, `uci` gets SIGPIPE, and the commit is skipped while wifi
# reload still runs against the uncommitted overlay.
- name: Commit all pending UCI configuration
  tags: [always]
  community.openwrt.uci:
    command: commit
  register: flint2_uci_commit

- name: Reload services after UCI apply
  tags: [always]
  community.openwrt.command:
    cmd: |
      set -eu
      uci commit
      remaining="$(uci changes 2>/dev/null || true)"
      if [ -n "$remaining" ]; then
        echo "uci commit left pending changes:" >&2
        echo "$remaining" >&2
        exit 1
      fi
      /etc/init.d/system reload
      if [ -x /sbin/wifi ] && [ -f /etc/config/wireless ]; then
        /sbin/wifi reload
      fi
      if [ -x /etc/init.d/chronyd ]; then
        /etc/init.d/chronyd restart
      elif [ -x /etc/init.d/sysntpd ]; then
        /etc/init.d/sysntpd restart
      fi
      if [ -x /etc/init.d/nginx ]; then
        /etc/init.d/nginx restart
      fi
      if [ -x /etc/init.d/uhttpd ]; then
        /etc/init.d/uhttpd restart
      fi
      if [ -x /etc/init.d/luci_statistics ]; then
        /etc/init.d/luci_statistics restart
      fi
      if [ -x /etc/init.d/collectd ]; then
        /etc/init.d/collectd restart
      fi
      if [ -x /etc/init.d/usteer ]; then
        /etc/init.d/usteer restart
      fi
      if [ -x /etc/init.d/dropbear ]; then
        /etc/init.d/dropbear restart
      fi
    uses_shell: true
  register: flint2_apply
  changed_when: flint2_uci_commit is changed

# E1/E2 take effect in the kernel, not from uci commit alone. Writing sysfs
# avoids /etc/init.d/network reload, which would bounce br-lan (management IP).
# Run only when the bridge UCI actually changed; skip when the sysfs knobs
# are absent (Molecule containers).
- name: Apply LAN bridge multicast settings to the running kernel
  when:
    - flint2_bridge_enabled | default(true) | bool
    - flint2_bridge_uci_changed | default(false) | bool
  tags: [always]
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      bridge="{{ flint2_bridge.name }}"
      snooping="{{ flint2_bridge.igmp_snooping }}"
      querier="{{ flint2_bridge.multicast_querier }}"
      sysfs="/sys/class/net/${bridge}/bridge"
      if [ ! -d "$sysfs" ]; then
        echo "skipping live bridge apply; ${sysfs} not present"
        exit 0
      fi
      printf '%s\n' "$snooping" > "${sysfs}/multicast_snooping"
      printf '%s\n' "$querier" > "${sysfs}/multicast_querier"
    uses_shell: true
  register: flint2_bridge_live_apply
  changed_when: flint2_bridge_live_apply.stdout is not search('skipping live bridge apply')
