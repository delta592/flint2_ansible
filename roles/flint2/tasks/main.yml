---
- name: Manage Flint 2 packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: [packages]
  tags: [packages]

- name: Configure Flint 2 system settings
  ansible.builtin.include_tasks:
    file: system.yml
    apply:
      tags: [system]
  tags: [system]

- name: Configure Flint 2 NTP time synchronization
  ansible.builtin.include_tasks:
    file: ntp.yml
    apply:
      tags: [ntp]
  tags: [ntp]

- name: Configure Flint 2 wireless networks
  ansible.builtin.include_tasks:
    file: wireless.yml
    apply:
      tags: [wireless]
  tags: [wireless]

- name: Install Flint 2 TLS certificates
  ansible.builtin.include_tasks:
    file: tls.yml
    apply:
      tags: [tls]
  tags: [tls]

- name: Ensure LuCI is installed and configured
  ansible.builtin.include_tasks:
    file: luci.yml
    apply:
      tags: [luci, access_control]
  tags: [luci, access_control]

- name: Configure Flint 2 local access control
  ansible.builtin.include_tasks:
    file: access_control.yml
    apply:
      tags: [access_control]
  tags: [access_control]

- name: Configure Flint 2 SSH access
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: [ssh]
  tags: [ssh]

- name: Commit all UCI changes and restart affected services
  when: not ansible_check_mode
  ansible.builtin.include_tasks:
    file: apply.yml
    apply:
      tags: [always]
  tags: [always]

- name: Validate Flint 2 configuration
  when: not ansible_check_mode
  ansible.builtin.include_tasks:
    file: verify.yml
    apply:
      tags: [verify]
  tags: [verify]
