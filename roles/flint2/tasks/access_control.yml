---
- name: Configure GL.iNet admin panel Force HTTPS
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_access_control.admin.redirect_https is defined
  community.openwrt.uci:
    command: set
    key: oui-httpd.main.redirect_https
    value: "{{ flint2_access_control.admin.redirect_https }}"
  notify: flint2 nginx changed

- name: Configure GL.iNet admin panel auto-logout timeout
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_access_control.admin.session_timeout_minutes is defined
  community.openwrt.uci:
    command: set
    key: oui-httpd.main.session_timeout
    value: "{{ flint2_access_control.admin.session_timeout_minutes | int * 60 }}"
  notify: flint2 nginx changed

- name: Configure GL.iNet admin panel HTTP and HTTPS ports
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_access_control.admin.http_port is defined
    - flint2_access_control.admin.https_port is defined
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      conf="{{ flint2_nginx_gl_conf | quote }}"
      http_port="{{ flint2_access_control.admin.http_port }}"
      https_port="{{ flint2_access_control.admin.https_port }}"
      cur_http="$(grep -E '^[[:space:]]*listen [0-9]+;' "$conf" | head -1 | grep -oE '[0-9]+' || true)"
      cur_https="$(grep -E '^[[:space:]]*listen [0-9]+ ssl;' "$conf" | head -1 | grep -oE '[0-9]+' || true)"
      if [ "$cur_http" = "$http_port" ] && [ "$cur_https" = "$https_port" ]; then
        exit 0
      fi
      sed -i "s/^\([[:space:]]*listen \)[0-9]\+;/\1${http_port};/" "$conf"
      sed -i "s/^\([[:space:]]*listen \[::\]:\)[0-9]\+;/\1${http_port};/" "$conf"
      sed -i "s/^\([[:space:]]*listen \)[0-9]\+\([[:space:]]\+ssl;\)/\1${https_port}\2/" "$conf"
      sed -i "s/^\([[:space:]]*listen \[::\]:\)[0-9]\+\([[:space:]]\+ssl;\)/\1${https_port}\2/" "$conf"
      echo changed
    uses_shell: true
  register: flint2_admin_panel_ports
  changed_when: flint2_admin_panel_ports.stdout is search('changed')
  notify: flint2 nginx changed

- name: Enable LuCI uHTTPd service
  when: flint2_access_control_enabled | default(true) | bool
  community.openwrt.uci:
    command: set
    key: uhttpd.main.enabled
    value: "1"
  notify: flint2 uhttpd changed

- name: Configure LuCI Force HTTPS redirect
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_access_control.luci.redirect_https is defined
  community.openwrt.uci:
    command: set
    key: uhttpd.main.redirect_https
    value: "{{ flint2_access_control.luci.redirect_https }}"
  notify: flint2 uhttpd changed

- name: Configure LuCI HTTP and HTTPS listen ports
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_access_control.luci.http_port is defined
    - flint2_access_control.luci.https_port is defined
  community.openwrt.uci:
    command: set
    key: "uhttpd.main.{{ item.option }}"
    value:
      - "0.0.0.0:{{ item.port }}"
      - "[::]:{{ item.port }}"
  loop:
    - option: listen_http
      port: "{{ flint2_access_control.luci.http_port }}"
    - option: listen_https
      port: "{{ flint2_access_control.luci.https_port }}"
  loop_control:
    label: "uhttpd.main.{{ item.option }}={{ item.port }}"
  notify: flint2 uhttpd changed

- name: Enable Dropbear SSH service
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_access_control.ssh.enabled is defined
    - flint2_ssh_backend | default('openssh') == 'dropbear'
  community.openwrt.uci:
    command: set
    key: dropbear.main.enable
    value: "{{ flint2_access_control.ssh.enabled }}"
  notify: flint2 dropbear changed

- name: Disable Dropbear when OpenSSH is the SSH backend
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_ssh_backend | default('openssh') == 'openssh'
  community.openwrt.uci:
    command: set
    key: dropbear.main.enable
    value: "0"

- name: Configure Dropbear SSH port
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_access_control.ssh.port is defined
    - flint2_ssh_backend | default('openssh') == 'dropbear'
  community.openwrt.uci:
    command: set
    key: dropbear.main.Port
    value: "{{ flint2_access_control.ssh.port }}"
  notify: flint2 dropbear changed
