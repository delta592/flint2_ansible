---
- name: Install Flint 2 statistics packages with apk
  when:
    - flint2_statistics_enabled | default(true) | bool
    - flint2_statistics_packages | default([]) | length > 0
    - openwrt_package_manager == "apk"
  community.openwrt.apk:
    name: "{{ flint2_statistics_packages | join(',') }}"
    state: present
    update_cache: true
  notify: flint2 statistics changed

- name: Install Flint 2 statistics packages with opkg
  when:
    - flint2_statistics_enabled | default(true) | bool
    - flint2_statistics_packages | default([]) | length > 0
    - openwrt_package_manager == "opkg"
  community.openwrt.opkg:
    name: "{{ flint2_statistics_packages | join(',') }}"
    state: present
    update_cache: true
  notify: flint2 statistics changed

- name: Configure LuCI Statistics collectd plugins
  when: flint2_statistics_enabled | default(true) | bool
  block:
    - name: Check for luci_statistics UCI config
      community.openwrt.stat:
        path: /etc/config/luci_statistics
      register: flint2_statistics_config_file

    - name: Assert luci_statistics UCI config exists
      ansible.builtin.assert:
        that:
          - flint2_statistics_config_file.stat.exists
        fail_msg: luci_statistics UCI config missing; install luci-app-statistics first

    - name: Configure collectd read interval
      community.openwrt.uci:
        command: section
        config: luci_statistics
        type: statistics
        name: collectd
        value:
          Interval: "{{ flint2_statistics_interval | default(30) }}"
      notify: flint2 statistics changed

    - name: Enable collectd plugins
      community.openwrt.uci:
        command: section
        config: luci_statistics
        type: statistics
        name: "{{ item }}"
        value:
          enable: "1"
      loop: "{{ flint2_statistics_plugins }}"
      notify: flint2 statistics changed

- name: Enable collectd and luci_statistics at boot
  when: flint2_statistics_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      changed=0
      for svc in collectd luci_statistics; do
        [ -x "/etc/init.d/${svc}" ] || continue
        if ! "/etc/init.d/${svc}" enabled; then
          "/etc/init.d/${svc}" enable
          changed=1
        fi
      done
      if [ "$changed" -eq 1 ]; then
        echo changed
      fi
    uses_shell: true
  register: flint2_statistics_enable
  changed_when: flint2_statistics_enable.stdout is search('changed')
  notify: flint2 statistics changed
