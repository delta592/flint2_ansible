---
# Legacy Dropbear path (Molecule / optional). Cannot clear NIST ECDH KEX FAILs.

- name: Disable Dropbear password authentication
  community.openwrt.uci:
    command: set
    key: dropbear.main.PasswordAuth
    value: "{{ flint2_dropbear_password_auth }}"
  notify: flint2 dropbear changed

- name: Disable Dropbear root password authentication
  community.openwrt.uci:
    command: set
    key: dropbear.main.RootPasswordAuth
    value: "{{ flint2_dropbear_root_password_auth }}"
  notify: flint2 dropbear changed

- name: Set Dropbear MaxAuthTries
  community.openwrt.uci:
    command: set
    key: dropbear.main.MaxAuthTries
    value: "{{ flint2_dropbear_max_auth_tries }}"
  notify: flint2 dropbear changed

- name: Set Dropbear IdleTimeout
  community.openwrt.uci:
    command: set
    key: dropbear.main.IdleTimeout
    value: "{{ flint2_dropbear_idle_timeout }}"
  notify: flint2 dropbear changed

- name: Disable Dropbear mDNS advertisement
  community.openwrt.uci:
    command: set
    key: dropbear.main.mdns
    value: "{{ flint2_dropbear_mdns }}"
  notify: flint2 dropbear changed

- name: Bind Dropbear to configured network Interface
  when: flint2_dropbear_interface is defined
  community.openwrt.uci:
    command: set
    key: dropbear.main.Interface
    value: "{{ flint2_dropbear_interface }}"
  notify: flint2 dropbear changed

- name: Ensure Dropbear authorized_keys directory exists
  when: flint2_ssh_authorized_keys | length > 0
  community.openwrt.file:
    path: /etc/dropbear
    state: directory
    mode: "0755"

- name: Ensure Dropbear ed25519 host key exists
  when: flint2_dropbear_keyfiles | length > 0
  community.openwrt.command:
    cmd: |
      set -eu
      key=/etc/dropbear/dropbear_ed25519_host_key
      if [ ! -s "$key" ]; then
        mkdir -p /etc/dropbear
        dropbearkey -t ed25519 -f "$key"
        chmod 0600 "$key"
        echo generated
      else
        echo present
      fi
    uses_shell: true
  register: flint2_dropbear_ed25519_host_key
  changed_when: flint2_dropbear_ed25519_host_key.stdout is search('generated')
  notify: flint2 dropbear changed

- name: Read Dropbear host keyfile list
  community.openwrt.uci:
    command: get
    key: dropbear.main.keyfile
  register: flint2_dropbear_keyfile_current
  failed_when: false
  changed_when: false

- name: Clear Dropbear host keyfile list when it differs from desired
  when:
    - (flint2_dropbear_keyfile_current.result_list | default([]) | list) | length > 0
    - (flint2_dropbear_keyfile_current.result_list | default([]) | list) != (flint2_dropbear_keyfiles | list)
  community.openwrt.uci:
    command: absent
    key: dropbear.main.keyfile
  notify: flint2 dropbear changed

- name: Restrict Dropbear to configured host key files
  when:
    - (flint2_dropbear_keyfile_current.result_list | default([]) | list) != (flint2_dropbear_keyfiles | list)
  community.openwrt.uci:
    command: add_list
    key: dropbear.main.keyfile
    value: "{{ item }}"
    unique: true
  loop: "{{ flint2_dropbear_keyfiles }}"
  notify: flint2 dropbear changed

- name: Install SSH public keys for root (Dropbear)
  when: flint2_ssh_authorized_keys | length > 0
  community.openwrt.lineinfile:
    path: /etc/dropbear/authorized_keys
    line: "{{ item }}"
    create: true
    mode: "0600"
    state: present
  loop: "{{ flint2_ssh_authorized_keys }}"
  loop_control:
    label: "{{ item.split()[0] }} {{ item.split()[1] if item.split() | length > 1 else 'key' }}"
