---
- name: Configure wireless radio device settings
  when:
    - flint2_wireless.radios | default([]) | length > 0
    - item.0[item.1] is defined
  community.openwrt.uci:
    command: set
    key: "wireless.{{ item.0.device }}.{{ item.1 }}"
    value: "{{ item.0[item.1] }}"
  loop: "{{ flint2_wireless.radios | product(flint2_wireless_device_option_keys) | list }}"
  loop_control:
    label: "{{ item.0.device }}.{{ item.1 }}={{ item.0.get(item.1, '') }}"

- name: Configure wireless options on main AP interfaces
  when:
    - flint2_wireless.radios | default([]) | length > 0
    - item.0.iface is defined
    - flint2_wireless[item.1] is defined
    - item.1 != 'key' or (flint2_wireless.key | default('') | length > 0)
  community.openwrt.uci:
    command: set
    key: "wireless.{{ item.0.iface }}.{{ item.1 }}"
    value: "{{ flint2_wireless[item.1] }}"
  loop: "{{ flint2_wireless.radios | product(flint2_wireless_iface_option_keys) | list }}"
  loop_control:
    label: "{{ item.0.iface }}.{{ item.1 }}"
  no_log: "{{ item.1 == 'key' }}"
