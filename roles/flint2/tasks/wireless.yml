---
- name: Configure wireless radio device settings
  when:
    - flint2_wireless.radios | default([]) | length > 0
    - item.0[item.1] is defined
  community.openwrt.uci:
    command: set
    key: "wireless.{{ item.0.device }}.{{ item.1 }}"
    value: "{{ item.0[item.1] }}"
  loop: "{{ flint2_wireless.radios | product(flint2_wireless_device_option_keys) | list }}"
  loop_control:
    label: "{{ item.0.device }}.{{ item.1 }}={{ item.0.get(item.1, '') }}"

# Shared keys apply to every main iface unless that radio's iface_options overrides the key.
- name: Configure wireless options on main AP interfaces
  when:
    - flint2_wireless.radios | default([]) | length > 0
    - item.0.iface is defined
    - flint2_wireless[item.1] is defined
    - item.1 != 'key' or (flint2_wireless.key | default('') | length > 0)
    - item.0.iface_options is not defined or item.1 not in item.0.iface_options
  community.openwrt.uci:
    command: set
    key: "wireless.{{ item.0.iface }}.{{ item.1 }}"
    value: "{{ flint2_wireless[item.1] }}"
  loop: "{{ flint2_wireless.radios | product(flint2_wireless_iface_option_keys) | list }}"
  loop_control:
    label: "{{ item.0.iface }}.{{ item.1 }}"
  no_log: "{{ item.1 == 'key' }}"

# Per-radio wifi-iface options (B6 macfilter/maclist; B9 ieee80211w). Prefer overrides over shared keys.
- name: Apply per-radio wireless interface options
  when:
    - flint2_wireless_radio.iface is defined
    - flint2_wireless_radio.iface_options is defined
  ansible.builtin.include_tasks: wireless_iface_options.yml
  loop: "{{ flint2_wireless.radios | default([]) }}"
  loop_control:
    loop_var: flint2_wireless_radio
    label: "{{ flint2_wireless_radio.iface | default(flint2_wireless_radio.device | default('radio')) }}"

- name: Configure encryption and key on guest and IoT interfaces
  when:
    - flint2_wireless_guest_ifaces | default([]) | length > 0
    - flint2_wireless_guest[item.1] is defined
    - item.1 != 'key' or (flint2_wireless_guest.key | default('') | length > 0)
  community.openwrt.uci:
    command: set
    key: "wireless.{{ item.0 }}.{{ item.1 }}"
    value: "{{ flint2_wireless_guest[item.1] }}"
  loop: "{{ flint2_wireless_guest_ifaces | product(flint2_wireless_guest_option_keys | default(['encryption', 'key'])) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"
  no_log: "{{ item.1 == 'key' }}"
