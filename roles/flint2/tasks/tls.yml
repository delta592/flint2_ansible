---
# Deploy leaf + intermediate (as a full chain) and the private key to the GL.iNet
# nginx UI and LuCI uHTTPd. community.openwrt.copy rewrites a file only when its
# checksum differs; each installed file about to be replaced is first copied to
# <path>.<flint2_tls_backup_suffix>.
- name: Install TLS certificates on nginx and uHTTPd
  when: flint2_tls_enabled | bool
  vars:
    flint2_tls_leaf_cert_path: "{{ flint2_tls_cert_files_dir }}/{{ flint2_tls_leaf_cert }}"
    flint2_tls_intermediate_cert_path: "{{ flint2_tls_cert_files_dir }}/{{ flint2_tls_intermediate_cert }}"
    flint2_tls_private_key_path: "{{ flint2_tls_private_key_dir }}/{{ flint2_tls_private_key }}"
    flint2_tls_fullchain_path: "{{ flint2_tls_cert_files_dir }}/{{ flint2_tls_fullchain_name }}"
    flint2_tls_targets:
      - src: "{{ flint2_tls_fullchain_path }}"
        dest: "{{ flint2_tls_nginx_cert_path }}"
        mode: "0644"
        service: nginx
      - src: "{{ flint2_tls_private_key_path }}"
        dest: "{{ flint2_tls_nginx_key_path }}"
        mode: "0600"
        service: nginx
      - src: "{{ flint2_tls_fullchain_path }}"
        dest: "{{ flint2_tls_uhttpd_cert_path }}"
        mode: "0644"
        service: uhttpd
      - src: "{{ flint2_tls_private_key_path }}"
        dest: "{{ flint2_tls_uhttpd_key_path }}"
        mode: "0600"
        service: uhttpd
  block:
    - name: Verify TLS certificate files exist on control node
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ flint2_tls_leaf_cert_path }}"
        - "{{ flint2_tls_intermediate_cert_path }}"
        - "{{ flint2_tls_private_key_path }}"
      register: flint2_tls_local_files

    - name: Assert TLS certificate files exist on control node
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing TLS file on control node: {{ item.item }}"
      loop: "{{ flint2_tls_local_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Byte-for-byte leaf + intermediate (rstrip=false keeps trailing newlines).
    # Runs in check mode too: the router copy below needs the chain as its source.
    - name: Build TLS full certificate chain on control node
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', flint2_tls_leaf_cert_path, rstrip=false) }}{{
          lookup('ansible.builtin.file', flint2_tls_intermediate_cert_path, rstrip=false) }}
        dest: "{{ flint2_tls_fullchain_path }}"
        mode: "0644"
      check_mode: false

    - name: Verify TLS leaf certificate and private key match
      delegate_to: localhost
      become: false
      ansible.builtin.shell: |
        set -euo pipefail
        cert_hash="$(openssl x509 -in {{ flint2_tls_leaf_cert_path | quote }} -pubkey -noout | openssl sha256)"
        key_hash="$(openssl pkey -in {{ flint2_tls_private_key_path | quote }} -pubout | openssl sha256)"
        test "$cert_hash" = "$key_hash"
      args:
        executable: /bin/bash
      changed_when: false
      check_mode: false

    - name: Read desired TLS material checksums on control node
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ flint2_tls_fullchain_path }}"
        - "{{ flint2_tls_private_key_path }}"
      register: flint2_tls_desired_checksums
      no_log: true

    - name: Read installed TLS material checksums on router
      community.openwrt.stat:
        path: "{{ item.dest }}"
        checksum_algorithm: sha256
      loop: "{{ flint2_tls_targets }}"
      loop_control:
        label: "{{ item.dest }}"
      register: flint2_tls_installed_checksums
      no_log: true

    - name: Back up installed TLS material that is about to be replaced
      when:
        - item.stat.exists
        - >-
          item.stat.checksum !=
          (flint2_tls_desired_checksums.results | selectattr('item', 'equalto', item.item.src) | first).stat.checksum
      community.openwrt.command:
        cmd: cp -p {{ item.item.dest | quote }} {{ (item.item.dest ~ '.' ~ flint2_tls_backup_suffix) | quote }}
        # The module's non-shell mode (xargs) fails in the Molecule container; the shell path works everywhere.
        uses_shell: true
      loop: "{{ flint2_tls_installed_checksums.results }}"
      loop_control:
        label: "{{ item.item.dest }}.{{ flint2_tls_backup_suffix }}"

    - name: Install TLS certificate chain and key for GL.iNet nginx UI
      community.openwrt.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop: "{{ flint2_tls_targets | selectattr('service', 'equalto', 'nginx') | list }}"
      loop_control:
        label: "{{ item.dest }}"
      no_log: true
      notify: flint2 nginx changed

    - name: Install TLS certificate chain and key for LuCI uHTTPd
      community.openwrt.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop: "{{ flint2_tls_targets | selectattr('service', 'equalto', 'uhttpd') | list }}"
      loop_control:
        label: "{{ item.dest }}"
      no_log: true
      notify: flint2 uhttpd changed

    - name: Ensure LuCI uHTTPd is enabled when TLS is managed
      community.openwrt.uci:
        command: set
        key: uhttpd.main.enabled
        value: "1"
      notify: flint2 uhttpd changed
