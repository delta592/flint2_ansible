---
- name: Install Flint 2 usteer packages with apk
  when:
    - flint2_usteer_enabled | default(true) | bool
    - flint2_usteer_packages | default([]) | length > 0
    - openwrt_package_manager == "apk"
  community.openwrt.apk:
    name: "{{ flint2_usteer_packages | join(',') }}"
    state: present
    update_cache: true
  notify:
    - flint2 usteer changed
    - flint2 luci menu changed

- name: Install Flint 2 usteer packages with opkg
  when:
    - flint2_usteer_enabled | default(true) | bool
    - flint2_usteer_packages | default([]) | length > 0
    - openwrt_package_manager == "opkg"
  community.openwrt.opkg:
    name: "{{ flint2_usteer_packages | join(',') }}"
    state: present
    update_cache: true
  notify:
    - flint2 usteer changed
    - flint2 luci menu changed

- name: Configure usteer active AP-side steering
  when: flint2_usteer_enabled | default(true) | bool
  vars:
    flint2_usteer_ssids: >-
      {{
        flint2_usteer.ssid_list
        if (flint2_usteer.ssid_list | default([]) | length > 0)
        else ([flint2_wireless.ssid] if (flint2_wireless.ssid | default('') | length > 0) else [])
      }}
  block:
    - name: Assert usteer has SSIDs to steer
      ansible.builtin.assert:
        that:
          - flint2_usteer_ssids | length > 0
        fail_msg: usteer ssid_list is empty and flint2_wireless.ssid is unset

    - name: Ensure usteer UCI config file exists
      community.openwrt.copy:
        content: ""
        dest: /etc/config/usteer
        force: false
        mode: "0644"
      notify: flint2 usteer changed

    # Configures the first usteer section, creating it when the file has none.
    - name: Configure usteer settings
      community.openwrt.uci:
        command: section
        config: usteer
        type: usteer
        find: {}
        value:
          network: "{{ flint2_usteer.network | default('lan') }}"
          local_mode: "{{ flint2_usteer.local_mode | default('1') }}"
          syslog: "{{ flint2_usteer.syslog | default('1') }}"
          debug_level: "{{ flint2_usteer.debug_level | default('2') }}"
          ipv6: "{{ flint2_usteer.ipv6 | default('0') }}"
          assoc_steering: "{{ flint2_usteer.assoc_steering | default('1') }}"
          band_steering_interval: "{{ flint2_usteer.band_steering_interval | default('10000') }}"
          band_steering_min_snr: "{{ flint2_usteer.band_steering_min_snr | default('15') }}"
          band_steering_threshold: "{{ flint2_usteer.band_steering_threshold | default('1') }}"
          ssid_list: "{{ flint2_usteer_ssids }}"
      notify: flint2 usteer changed

- name: Enable usteer at boot
  when: flint2_usteer_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      changed=0
      if [ ! -x /etc/init.d/usteer ]; then
        echo "usteer init script missing; install the usteer package first" >&2
        exit 1
      fi
      if ! /etc/init.d/usteer enabled; then
        /etc/init.d/usteer enable
        changed=1
      fi
      if [ "$changed" -eq 1 ]; then
        echo changed
      fi
    uses_shell: true
  register: flint2_usteer_enable
  changed_when: flint2_usteer_enable.stdout is search('changed')
  notify: flint2 usteer changed
