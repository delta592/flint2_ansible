---
- name: Read configured system hostname
  community.openwrt.uci:
    command: get
    key: system.@system[0].hostname
  register: flint2_verify_hostname
  changed_when: false

- name: Assert system hostname matches desired value
  when: flint2_hostname is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_hostname.result == flint2_hostname
    fail_msg: "Hostname is '{{ flint2_verify_hostname.result }}', expected '{{ flint2_hostname }}'"

- name: Read configured LuCI time format
  when: flint2_clock_hourcycle is defined
  community.openwrt.uci:
    command: get
    key: system.@system[0].clock_hourcycle
  register: flint2_verify_clock_hourcycle
  changed_when: false

- name: Assert LuCI time format matches desired value
  when: flint2_clock_hourcycle is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_clock_hourcycle.result == flint2_clock_hourcycle
    fail_msg: >-
      system.@system[0].clock_hourcycle is '{{ flint2_verify_clock_hourcycle.result }}',
      expected '{{ flint2_clock_hourcycle }}' (LuCI 24-Hour Clock is h23)

- name: Read live kernel hostname
  when:
    - flint2_hostname is defined
    - flint2_verify_live_hostname | default(true) | bool
  community.openwrt.command:
    cmd: cat /proc/sys/kernel/hostname
    uses_shell: true
  register: flint2_live_hostname_cmd
  changed_when: false

- name: Assert live kernel hostname matches desired value
  when:
    - flint2_hostname is defined
    - flint2_verify_live_hostname | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_live_hostname_cmd.stdout | trim == flint2_hostname
    fail_msg: >-
      Live hostname is '{{ flint2_live_hostname_cmd.stdout | trim }}',
      expected '{{ flint2_hostname }}' (run /etc/init.d/system reload if UCI is correct)

- name: Detect NTP configuration backend
  when: flint2_ntp_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      if [ -f /etc/config/chrony ] && [ -x /etc/init.d/chronyd ]; then
        echo chrony
      elif uci -q get system.ntp >/dev/null 2>&1; then
        echo sysntpd
      else
        echo unsupported
      fi
    uses_shell: true
  register: flint2_verify_ntp_backend
  changed_when: false

- name: Read configured chrony upstream pool
  when:
    - flint2_ntp_enabled | default(true) | bool
    - flint2_verify_ntp_backend.stdout == 'chrony'
  community.openwrt.uci:
    command: get
    key: chrony.flint2.hostname
  register: flint2_verify_chrony_hostname
  changed_when: false

- name: Assert chrony upstream pool matches desired value
  when:
    - flint2_ntp_enabled | default(true) | bool
    - flint2_verify_ntp_backend.stdout == 'chrony'
  ansible.builtin.assert:
    that:
      - flint2_verify_chrony_hostname.result == flint2_ntp.servers[0]
    fail_msg: >-
      chrony.flint2.hostname is '{{ flint2_verify_chrony_hostname.result }}',
      expected '{{ flint2_ntp.servers[0] }}'

- name: Read configured sysntpd upstream servers
  when:
    - flint2_ntp_enabled | default(true) | bool
    - flint2_verify_ntp_backend.stdout == 'sysntpd'
  community.openwrt.uci:
    command: get
    key: system.ntp.server
  register: flint2_verify_sysntpd_servers
  changed_when: false

- name: Assert sysntpd upstream servers match desired values
  when:
    - flint2_ntp_enabled | default(true) | bool
    - flint2_verify_ntp_backend.stdout == 'sysntpd'
  vars:
    flint2_verify_sysntpd_server_list: >-
      {{
        [flint2_verify_sysntpd_servers.result]
        if flint2_verify_sysntpd_servers.result is string
        else flint2_verify_sysntpd_servers.result | default([])
      }}
  ansible.builtin.assert:
    that:
      - flint2_verify_sysntpd_server_list | sort == flint2_ntp.servers | sort
    fail_msg: >-
      system.ntp.server is '{{ flint2_verify_sysntpd_servers.result | default([]) }}',
      expected '{{ flint2_ntp.servers }}'

- name: Read GL.iNet firmware Automatic Update Check setting
  when:
    - flint2_firmware_auto_update_check is defined
    - flint2_verify_glinet_settings | default(true) | bool
  community.openwrt.uci:
    command: get
    key: upgrade.general.upgrade_enable
  register: flint2_verify_firmware_auto_update_check
  changed_when: false

- name: Assert GL.iNet firmware Automatic Update Check matches desired value
  when:
    - flint2_firmware_auto_update_check is defined
    - flint2_verify_glinet_settings | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_firmware_auto_update_check.result == flint2_firmware_auto_update_check
    fail_msg: >-
      upgrade.general.upgrade_enable is '{{ flint2_verify_firmware_auto_update_check.result }}',
      expected '{{ flint2_firmware_auto_update_check }}'
      (GL.iNet UI → System → Upgrade → Automatic Update Check)

- name: Read GL.iNet network mode
  when:
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_network_mode is defined
  community.openwrt.uci:
    command: get
    key: glconfig.general.mode
  register: flint2_verify_network_mode
  changed_when: false

- name: Assert GL.iNet network mode matches desired value
  when:
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_network_mode is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_network_mode.result == flint2_network_mode
    fail_msg: "Network mode is '{{ flint2_verify_network_mode.result }}', expected '{{ flint2_network_mode }}'"

- name: Read LAN interface protocol
  when: flint2_lan_proto is defined
  community.openwrt.uci:
    command: get
    key: network.lan.proto
  register: flint2_verify_lan_proto
  changed_when: false

- name: Assert LAN uses expected IP protocol
  when: flint2_lan_proto is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_lan_proto.result == flint2_lan_proto
    fail_msg: "network.lan.proto is '{{ flint2_verify_lan_proto.result }}', expected '{{ flint2_lan_proto }}'"

- name: Read GL.iNet admin panel Force HTTPS setting
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.admin.redirect_https is defined
  community.openwrt.uci:
    command: get
    key: oui-httpd.main.redirect_https
  register: flint2_verify_admin_redirect_https
  changed_when: false

- name: Assert GL.iNet admin panel Force HTTPS matches desired value
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.admin.redirect_https is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_admin_redirect_https.result == flint2_access_control.admin.redirect_https
    fail_msg: >-
      oui-httpd.main.redirect_https is '{{ flint2_verify_admin_redirect_https.result }}',
      expected '{{ flint2_access_control.admin.redirect_https }}'

- name: Read GL.iNet admin panel auto-logout timeout
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.admin.session_timeout_minutes is defined
  community.openwrt.uci:
    command: get
    key: oui-httpd.main.session_timeout
  register: flint2_verify_admin_session_timeout
  changed_when: false

- name: Assert GL.iNet admin panel auto-logout timeout matches desired value
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.admin.session_timeout_minutes is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_admin_session_timeout.result | int == flint2_access_control.admin.session_timeout_minutes | int * 60
    fail_msg: >-
      oui-httpd.main.session_timeout is '{{ flint2_verify_admin_session_timeout.result }}',
      expected '{{ flint2_access_control.admin.session_timeout_minutes | int * 60 }}'

- name: Read GL.iNet admin panel nginx listen ports
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.admin.http_port is defined
    - flint2_access_control.admin.https_port is defined
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      conf="{{ flint2_nginx_gl_conf | quote }}"
      grep -E '^[[:space:]]*listen [0-9]+;' "$conf" | head -1 | grep -oE '[0-9]+'
      grep -E '^[[:space:]]*listen [0-9]+ ssl;' "$conf" | head -1 | grep -oE '[0-9]+'
    uses_shell: true
  register: flint2_verify_admin_panel_ports
  changed_when: false

- name: Assert GL.iNet admin panel nginx listen ports match desired values
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.admin.http_port is defined
    - flint2_access_control.admin.https_port is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_admin_panel_ports.stdout_lines[0] | int == flint2_access_control.admin.http_port | int
      - flint2_verify_admin_panel_ports.stdout_lines[1] | int == flint2_access_control.admin.https_port | int
    fail_msg: >-
      nginx admin panel ports are {{ flint2_verify_admin_panel_ports.stdout_lines | join('/') }},
      expected {{ flint2_access_control.admin.http_port }}/{{ flint2_access_control.admin.https_port }}

- name: Read LuCI Force HTTPS redirect setting
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.redirect_https is defined
  community.openwrt.uci:
    command: get
    key: uhttpd.main.redirect_https
  register: flint2_verify_luci_redirect_https
  changed_when: false

- name: Assert LuCI Force HTTPS redirect matches desired value
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.redirect_https is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_luci_redirect_https.result == flint2_access_control.luci.redirect_https
    fail_msg: >-
      uhttpd.main.redirect_https is '{{ flint2_verify_luci_redirect_https.result }}',
      expected '{{ flint2_access_control.luci.redirect_https }}'

- name: Read LuCI HTTP listen addresses
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.http_port is defined
  community.openwrt.uci:
    command: get
    key: uhttpd.main.listen_http
  register: flint2_verify_luci_listen_http
  changed_when: false

- name: Assert LuCI HTTP listen addresses match desired port
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.http_port is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_luci_listen_http.result is contains('0.0.0.0:' ~ flint2_access_control.luci.http_port)
      - flint2_verify_luci_listen_http.result is contains('[::]:' ~ flint2_access_control.luci.http_port)
    fail_msg: >-
      uhttpd.main.listen_http is '{{ flint2_verify_luci_listen_http.result }}',
      expected 0.0.0.0:{{ flint2_access_control.luci.http_port }} and [::]:{{ flint2_access_control.luci.http_port }}

- name: Read LuCI HTTPS listen addresses
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.https_port is defined
  community.openwrt.uci:
    command: get
    key: uhttpd.main.listen_https
  register: flint2_verify_luci_listen_https
  changed_when: false

- name: Assert LuCI HTTPS listen addresses match desired port
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.https_port is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_luci_listen_https.result is contains('0.0.0.0:' ~ flint2_access_control.luci.https_port)
      - flint2_verify_luci_listen_https.result is contains('[::]:' ~ flint2_access_control.luci.https_port)
    fail_msg: >-
      uhttpd.main.listen_https is '{{ flint2_verify_luci_listen_https.result }}',
      expected 0.0.0.0:{{ flint2_access_control.luci.https_port }} and [::]:{{ flint2_access_control.luci.https_port }}

- name: Assert LuCI uHTTPd ucode module is installed
  when:
    - flint2_luci_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
  community.openwrt.command:
    cmd: test -f /usr/lib/uhttpd_ucode.so
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_luci_uhttpd_ucode

- name: Assert LuCI uHTTPd handler is installed
  when:
    - flint2_luci_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
  community.openwrt.command:
    cmd: test -f /usr/share/ucode/luci/uhttpd.uc
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_luci_uhttpd_handler

- name: Assert LuCI packages are installed
  when:
    - flint2_luci_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_luci_uhttpd_ucode.rc == 0
      - flint2_verify_luci_uhttpd_handler.rc == 0
    fail_msg: >-
      LuCI is not installed (missing uhttpd-mod-ucode or luci-base).
      Enable flint2_luci_enabled or install LuCI from the GL.iNet UI first.

- name: Probe LuCI HTTPS endpoint
  when:
    - flint2_luci_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.https_port is defined
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      port="{{ flint2_access_control.luci.https_port }}"
      url="https://127.0.0.1:${port}/cgi-bin/luci/"
      if command -v curl >/dev/null 2>&1; then
        headers="$(curl -skI --max-time 10 "$url" 2>/dev/null || true)"
      else
        headers="$(uclient-fetch -q -O /dev/null --no-check-certificate "$url" 2>&1 || true)"
      fi
      if echo "$headers" | grep -Eiq '404|not found on this server'; then
        echo "LuCI endpoint returned 404"
        exit 1
      fi
      if echo "$headers" | grep -Eiq 'x-luci-login-required|403 forbidden'; then
        exit 0
      fi
      exit 0
    uses_shell: true
  changed_when: false
  register: flint2_verify_luci_probe

- name: Assert LuCI HTTPS endpoint responds
  when:
    - flint2_luci_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.luci.https_port is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_luci_probe.rc == 0
    fail_msg: >-
      LuCI is not reachable on HTTPS port {{ flint2_access_control.luci.https_port }}
      (expected login page, not uHTTPd 404).

- name: Check LuCI Statistics frontend is installed
  when: flint2_statistics_enabled | default(true) | bool
  community.openwrt.command:
    cmd: test -f /usr/share/luci/menu.d/luci-app-statistics.json
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_statistics_menu

- name: Check collectd thermal and sensors plugins are installed
  when: flint2_statistics_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      test -f /usr/lib/collectd/thermal.so
      test -f /usr/lib/collectd/sensors.so
      test -f /usr/lib/collectd/rrdtool.so
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_statistics_plugins

- name: Assert LuCI Statistics packages are installed
  when: flint2_statistics_enabled | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_statistics_menu.rc == 0
      - flint2_verify_statistics_plugins.rc == 0
    fail_msg: >-
      LuCI Statistics is missing luci-app-statistics or collectd thermal/sensors/rrdtool
      plugins. Run the statistics tag or install luci-app-statistics.

- name: Read configured collectd plugin enablement
  when: flint2_statistics_enabled | default(true) | bool
  community.openwrt.uci:
    command: get
    key: "luci_statistics.{{ item }}.enable"
  loop: "{{ flint2_statistics_plugins | default([]) }}"
  register: flint2_verify_statistics_plugin_enable
  changed_when: false

- name: Assert collectd plugins are enabled
  when:
    - flint2_statistics_enabled | default(true) | bool
    - flint2_verify_statistics_plugin_enable.results | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - item.result == "1"
    fail_msg: >-
      luci_statistics.{{ item.item }}.enable is '{{ item.result }}', expected '1'
  loop: "{{ flint2_verify_statistics_plugin_enable.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read configured collectd interval
  when: flint2_statistics_enabled | default(true) | bool
  community.openwrt.uci:
    command: get
    key: luci_statistics.collectd.Interval
  register: flint2_verify_statistics_interval
  changed_when: false

- name: Assert collectd interval matches desired value
  when: flint2_statistics_enabled | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_statistics_interval.result | int == flint2_statistics_interval | int
    fail_msg: >-
      luci_statistics.collectd.Interval is '{{ flint2_verify_statistics_interval.result }}',
      expected '{{ flint2_statistics_interval }}'

- name: Check collectd service is running
  when: flint2_statistics_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      test -x /etc/init.d/collectd
      /etc/init.d/collectd running
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_collectd_running

- name: Assert collectd service is running
  when: flint2_statistics_enabled | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_collectd_running.rc == 0
    fail_msg: collectd is not running; thermal graphs will not update

- name: Read SoC thermal zone temperature
  when:
    - flint2_statistics_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      zone=""
      for path in /sys/class/thermal/thermal_zone*/temp; do
        [ -r "$path" ] || continue
        zone="$path"
        break
      done
      test -n "$zone"
      temp="$(cat "$zone")"
      test "$temp" -gt 0
      echo "$temp"
    uses_shell: true
  changed_when: false
  register: flint2_verify_thermal_zone

- name: Assert SoC thermal zone is readable
  when:
    - flint2_statistics_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_thermal_zone.rc == 0
      - flint2_verify_thermal_zone.stdout | trim | int > 0
    fail_msg: No readable /sys/class/thermal/thermal_zone*/temp value found

- name: Check usteer package and init script are installed
  when: flint2_usteer_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      test -x /etc/init.d/usteer
      test -f /etc/config/usteer
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_usteer_installed

- name: Assert usteer is installed
  when: flint2_usteer_enabled | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_usteer_installed.rc == 0
    fail_msg: >-
      usteer is not installed. Run the usteer tag (make usteer) or install the
      usteer package from device feeds.

- name: Check luci-app-usteer menu is present
  when:
    - flint2_usteer_enabled | default(true) | bool
    - "'luci-app-usteer' in (flint2_usteer_packages | default([]))"
  community.openwrt.command:
    cmd: test -f /usr/share/luci/menu.d/luci-app-usteer.json
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_usteer_luci_menu

- name: Assert luci-app-usteer menu file is installed
  when:
    - flint2_usteer_enabled | default(true) | bool
    - "'luci-app-usteer' in (flint2_usteer_packages | default([]))"
  ansible.builtin.assert:
    that:
      - flint2_verify_usteer_luci_menu.rc == 0
    fail_msg: >-
      luci-app-usteer menu is missing
      (/usr/share/luci/menu.d/luci-app-usteer.json). Install luci-app-usteer
      and re-run make usteer so LuCI cache is cleared.

- name: Read configured usteer options
  when: flint2_usteer_enabled | default(true) | bool
  community.openwrt.uci:
    command: get
    key: "usteer.@usteer[0].{{ item }}"
  loop:
    - network
    - local_mode
    - band_steering_interval
    - band_steering_min_snr
    - band_steering_threshold
  register: flint2_verify_usteer_options
  changed_when: false

- name: Assert usteer options match desired values
  when:
    - flint2_usteer_enabled | default(true) | bool
    - flint2_verify_usteer_options.results | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - item.result == flint2_usteer[item.item] | string
    fail_msg: >-
      usteer.@usteer[0].{{ item.item }} is '{{ item.result }}',
      expected '{{ flint2_usteer[item.item] }}'
  loop: "{{ flint2_verify_usteer_options.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read configured usteer SSID list
  when: flint2_usteer_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      uci -q get usteer.@usteer[0].ssid_list
    uses_shell: true
  register: flint2_verify_usteer_ssid_list
  changed_when: false

- name: Assert usteer SSID list includes the main wireless SSID
  when: flint2_usteer_enabled | default(true) | bool
  vars:
    flint2_usteer_expected_ssids: >-
      {{
        flint2_usteer.ssid_list
        if (flint2_usteer.ssid_list | default([]) | length > 0)
        else ([flint2_wireless.ssid] if flint2_wireless.ssid is defined else [])
      }}
    flint2_usteer_got_ssids: "{{ flint2_verify_usteer_ssid_list.stdout | trim | split }}"
  ansible.builtin.assert:
    that:
      - flint2_usteer_got_ssids | sort == flint2_usteer_expected_ssids | list | sort
    fail_msg: >-
      usteer.@usteer[0].ssid_list is '{{ flint2_usteer_got_ssids }}',
      expected '{{ flint2_usteer_expected_ssids }}'

- name: Check usteer service is running
  when: flint2_usteer_enabled | default(true) | bool
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      test -x /etc/init.d/usteer
      /etc/init.d/usteer running
    uses_shell: true
  changed_when: false
  failed_when: false
  register: flint2_verify_usteer_running

- name: Assert usteer service is running
  when: flint2_usteer_enabled | default(true) | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_usteer_running.rc == 0
    fail_msg: usteer is not running; active AP-side steering will not occur

- name: Read Dropbear SSH enablement
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.ssh.enabled is defined
  community.openwrt.uci:
    command: get
    key: dropbear.main.enable
  register: flint2_verify_dropbear_enable
  changed_when: false

- name: Assert Dropbear SSH enablement matches desired value
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.ssh.enabled is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_dropbear_enable.result == flint2_access_control.ssh.enabled
    fail_msg: >-
      dropbear.main.enable is '{{ flint2_verify_dropbear_enable.result }}',
      expected '{{ flint2_access_control.ssh.enabled }}'

- name: Read Dropbear SSH port
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.ssh.port is defined
  community.openwrt.uci:
    command: get
    key: dropbear.main.Port
  register: flint2_verify_dropbear_port
  changed_when: false

- name: Assert Dropbear SSH port matches desired value
  when:
    - flint2_access_control_enabled | default(true) | bool
    - flint2_verify_glinet_settings | default(true) | bool
    - flint2_access_control.ssh.port is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_dropbear_port.result | int == flint2_access_control.ssh.port | int
    fail_msg: >-
      dropbear.main.Port is '{{ flint2_verify_dropbear_port.result }}',
      expected '{{ flint2_access_control.ssh.port }}'

- name: Read configured wireless SSIDs on main AP interfaces
  when: flint2_wireless.ssid is defined
  community.openwrt.uci:
    command: get
    key: "wireless.{{ item.iface }}.ssid"
  loop: "{{ flint2_wireless.radios | default([]) | selectattr('iface', 'defined') | list }}"
  register: flint2_verify_wireless_ssids
  changed_when: false

- name: Assert wireless SSIDs match desired value
  when:
    - flint2_wireless.ssid is defined
    - flint2_verify_wireless_ssids.results | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - item.result == flint2_wireless.ssid
    fail_msg: "SSID on {{ item.item.iface }} is '{{ item.result }}'"
  loop: "{{ flint2_verify_wireless_ssids.results }}"
  loop_control:
    label: "{{ item.item.iface }}"

- name: Read configured shared wireless interface options
  when:
    - item.0.iface is defined
    - flint2_wireless[item.1] is defined
  community.openwrt.uci:
    command: get
    key: "wireless.{{ item.0.iface }}.{{ item.1 }}"
  loop: >-
    {{
      flint2_wireless.radios | default([])
      | product(
          flint2_wireless_iface_option_keys | default([])
          | reject('equalto', 'key')
          | reject('equalto', 'ssid')
          | list
        )
      | list
    }}
  loop_control:
    label: "{{ item.0.iface }}.{{ item.1 }}"
  register: flint2_verify_wireless_iface_options
  changed_when: false

- name: Assert shared wireless interface options match desired values
  when: flint2_verify_wireless_iface_options.results | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - item.result == flint2_wireless[item.item.1]
    fail_msg: >-
      wireless.{{ item.item.0.iface }}.{{ item.item.1 }} is '{{ item.result }}',
      expected '{{ flint2_wireless[item.item.1] }}'
  loop: "{{ flint2_verify_wireless_iface_options.results | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "{{ item.item.0.iface }}.{{ item.item.1 }}"

- name: Read live wireless SSID broadcast by each main AP interface
  when:
    - flint2_wireless.ssid is defined
    - flint2_verify_live_wireless | default(true) | bool
    - item.iface is defined
  community.openwrt.command:
    cmd: |
      set -euo pipefail
      ifname="$(uci -q get "wireless.{{ item.iface }}.ifname" 2>/dev/null || true)"
      if [ -z "$ifname" ]; then
        expr='@.{{ item.device }}.interfaces[@.section="{{ item.iface }}"].ifname'
        ifname="$(ubus call network.wireless status 2>/dev/null | jsonfilter -e "$expr" 2>/dev/null || true)"
      fi
      test -n "$ifname"
      iwinfo "$ifname" info | awk -F '"' '/ESSID/ {print $2; exit}'
    uses_shell: true
  loop: "{{ flint2_wireless.radios | default([]) | selectattr('iface', 'defined') | list }}"
  register: flint2_verify_wireless_live_ssids
  changed_when: false

- name: Assert live wireless SSID broadcasts match desired value
  when:
    - flint2_wireless.ssid is defined
    - flint2_verify_live_wireless | default(true) | bool
    - flint2_verify_wireless_live_ssids.results | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - item.stdout | trim == flint2_wireless.ssid
    fail_msg: >-
      Live SSID on {{ item.item.iface }} is '{{ item.stdout | trim }}',
      expected '{{ flint2_wireless.ssid }}' (run /sbin/wifi reload if UCI is correct)
  loop: "{{ flint2_verify_wireless_live_ssids.results | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "{{ item.item.iface }}"

- name: Read configured wireless radio device settings
  community.openwrt.uci:
    command: get
    key: "wireless.{{ item.0.device }}.{{ item.1 }}"
  loop: "{{ flint2_wireless.radios | default([]) | product(flint2_wireless_device_option_keys | default([])) | list }}"
  loop_control:
    label: "{{ item.0.device }}.{{ item.1 }}"
  when: item.0[item.1] is defined
  register: flint2_verify_radio_options
  changed_when: false

- name: Assert wireless radio device settings match desired values
  when:
    - flint2_verify_radio_options.results | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - item.result == item.item.0[item.item.1]
    fail_msg: >-
      wireless.{{ item.item.0.device }}.{{ item.item.1 }} is '{{ item.result }}',
      expected '{{ item.item.0[item.item.1] }}'
  loop: "{{ flint2_verify_radio_options.results | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "{{ item.item.0.device }}.{{ item.item.1 }}"

- name: Read guest and IoT wireless interface disabled state
  when: flint2_wireless_guest_ifaces | default([]) | length > 0
  community.openwrt.uci:
    command: get
    key: "wireless.{{ item }}.disabled"
  loop: "{{ flint2_wireless_guest_ifaces }}"
  register: flint2_verify_guest_disabled
  changed_when: false
  failed_when: false

- name: Assert guest and IoT wireless interfaces remain disabled
  when: flint2_verify_guest_disabled.results | default([]) | length > 0
  ansible.builtin.assert:
    that:
      - item.result | default('1') == '1'
    fail_msg: "Expected {{ item.item }} to remain disabled"
  loop: "{{ flint2_verify_guest_disabled.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read Dropbear authentication policy
  community.openwrt.uci:
    command: get
    key: "{{ item }}"
  loop:
    - dropbear.main.PasswordAuth
    - dropbear.main.RootPasswordAuth
  register: flint2_verify_dropbear_auth
  changed_when: false

- name: Assert Dropbear password authentication is disabled
  when: flint2_dropbear_password_auth is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_dropbear_auth.results[0].result == flint2_dropbear_password_auth
    fail_msg: >-
      dropbear.main.PasswordAuth is '{{ flint2_verify_dropbear_auth.results[0].result }}',
      expected '{{ flint2_dropbear_password_auth }}'

- name: Assert Dropbear root password authentication is disabled
  when: flint2_dropbear_root_password_auth is defined
  ansible.builtin.assert:
    that:
      - flint2_verify_dropbear_auth.results[1].result == flint2_dropbear_root_password_auth
    fail_msg: >-
      dropbear.main.RootPasswordAuth is '{{ flint2_verify_dropbear_auth.results[1].result }}',
      expected '{{ flint2_dropbear_root_password_auth }}'

- name: Check Dropbear authorized_keys file
  when: flint2_ssh_require_authorized_keys | bool
  community.openwrt.stat:
    path: /etc/dropbear/authorized_keys
  register: flint2_verify_authorized_keys_file
  changed_when: false

- name: Assert Dropbear authorized_keys exists for key-only SSH
  when: flint2_ssh_require_authorized_keys | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_authorized_keys_file.stat.exists
      - flint2_verify_authorized_keys_file.stat.size | int > 0
    fail_msg: /etc/dropbear/authorized_keys is missing or empty; key-only SSH requires at least one key

- name: Get expected nginx certificate fingerprint
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
  community.openwrt.command:
    cmd: openssl x509 -in {{ flint2_tls_nginx_cert_path | quote }} -noout -fingerprint -sha256
    uses_shell: true
  register: flint2_verify_tls_nginx_expected
  changed_when: false

- name: Get served nginx certificate fingerprint
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
  community.openwrt.command:
    cmd: openssl s_client -connect 127.0.0.1:443 -servername {{ flint2_fqdn | quote }} </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256
    uses_shell: true
  register: flint2_verify_tls_nginx_served
  changed_when: false

- name: Assert nginx serves the installed certificate on port 443
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_tls_nginx_served.stdout | length > 0
      - flint2_verify_tls_nginx_served.stdout == flint2_verify_tls_nginx_expected.stdout
    fail_msg: >-
      nginx TLS fingerprint mismatch on port 443
      (expected {{ flint2_verify_tls_nginx_expected.stdout | default('missing') }},
      served {{ flint2_verify_tls_nginx_served.stdout | default('missing') }})

- name: Get expected uHTTPd certificate fingerprint
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
  community.openwrt.command:
    cmd: openssl x509 -in {{ flint2_tls_uhttpd_cert_path | quote }} -noout -fingerprint -sha256
    uses_shell: true
  register: flint2_verify_tls_uhttpd_expected
  changed_when: false

- name: Get served uHTTPd certificate fingerprint
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
  community.openwrt.command:
    cmd: openssl s_client -connect 127.0.0.1:8443 -servername {{ flint2_fqdn | quote }} </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256
    uses_shell: true
  register: flint2_verify_tls_uhttpd_served
  changed_when: false

- name: Assert uHTTPd serves the installed certificate on port 8443
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
  ansible.builtin.assert:
    that:
      - flint2_verify_tls_uhttpd_served.stdout | length > 0
      - flint2_verify_tls_uhttpd_served.stdout == flint2_verify_tls_uhttpd_expected.stdout
    fail_msg: >-
      uHTTPd TLS fingerprint mismatch on port 8443
      (expected {{ flint2_verify_tls_uhttpd_expected.stdout | default('missing') }},
      served {{ flint2_verify_tls_uhttpd_served.stdout | default('missing') }})

- name: Verify GL.iNet UI TLS endpoint from control node
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
    - flint2_tls_verify_from_client | default(true) | bool
  delegate_to: localhost
  become: false
  vars:
    flint2_tls_expected_cert: "{{ flint2_env_dir }}/{{ flint2_tls_leaf_cert }}"
  ansible.builtin.shell: |
    set -euo pipefail
    host={{ flint2_tls_verify_host | quote }}
    port=443
    expected={{ flint2_tls_expected_cert | quote }}
    fqdn={{ flint2_fqdn | quote }}
    fp() { openssl x509 -noout -fingerprint -sha256 | awk -F= '{print $2}' | tr -d ': ' | tr A-Z a-z; }
    remote_pem=$(openssl s_client -connect "${host}:${port}" -servername "${host}" </dev/null 2>/dev/null)
    test -n "${remote_pem}"
    remote_fp=$(printf '%s\n' "$remote_pem" | fp)
    local_fp=$(openssl x509 -in "${expected}" -noout -fingerprint -sha256 | awk -F= '{print $2}' | tr -d ': ' | tr A-Z a-z)
    test -n "$remote_fp"
    test "$remote_fp" = "$local_fp"
    printf '%s\n' "$remote_pem" | openssl x509 -noout -checkend 0
    printf '%s\n' "$remote_pem" | openssl x509 -noout -ext subjectAltName | grep -Fq "$fqdn"
  args:
    executable: /bin/bash
  register: flint2_verify_tls_443
  changed_when: false

- name: Verify LuCI TLS endpoint from control node
  when:
    - flint2_tls_enabled | bool
    - flint2_tls_verify_endpoints | bool
    - flint2_tls_verify_from_client | default(true) | bool
  delegate_to: localhost
  become: false
  vars:
    flint2_tls_expected_cert: "{{ flint2_env_dir }}/{{ flint2_tls_leaf_cert }}"
  ansible.builtin.shell: |
    set -euo pipefail
    host={{ flint2_tls_verify_host | quote }}
    port=8443
    expected={{ flint2_tls_expected_cert | quote }}
    fqdn={{ flint2_fqdn | quote }}
    fp() { openssl x509 -noout -fingerprint -sha256 | awk -F= '{print $2}' | tr -d ': ' | tr A-Z a-z; }
    remote_pem=$(openssl s_client -connect "${host}:${port}" -servername "${host}" </dev/null 2>/dev/null)
    test -n "${remote_pem}"
    remote_fp=$(printf '%s\n' "$remote_pem" | fp)
    local_fp=$(openssl x509 -in "${expected}" -noout -fingerprint -sha256 | awk -F= '{print $2}' | tr -d ': ' | tr A-Z a-z)
    test -n "$remote_fp"
    test "$remote_fp" = "$local_fp"
    printf '%s\n' "$remote_pem" | openssl x509 -noout -checkend 0
    printf '%s\n' "$remote_pem" | openssl x509 -noout -ext subjectAltName | grep -Fq "$fqdn"
  args:
    executable: /bin/bash
  register: flint2_verify_tls_8443
  changed_when: false
